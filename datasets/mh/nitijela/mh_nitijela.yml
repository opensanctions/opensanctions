  lang: eng

names:
  # Members are listed as "<role> - <honorific> <name>". The honorifics stack, e.g.
  # "Her Excellency Dr. Hilda C. Heine" and "Honorable Minister Bremity Lakjohn", so
  # each form is listed separately and stripping repeats until none matches.
  prefixes_strip:
    - Her Excellency
    - His Excellency
    - Honorable
    - Hon.
    - Minister
    - Senator
    - Dr.

