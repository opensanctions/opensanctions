summary: >-
  Unicameral legislature that elects the President from among its members
description: |
  Current members of the Nitijela, the unicameral legislature of the Republic of the Marshall
  Islands. Its members are elected for four-year terms and hold the country's legislative
  power, including passing laws and approving the budget. The President is elected by and from
  among the members, and cabinet ministers are likewise drawn from the membership, so the
  President, Speaker and ministers all sit as members alongside the backbench senators.
url: https://www.rmiparliament.org/
publisher:
  name: Nitijela of the Marshall Islands
  acronym: Nitijela
  description: >
    The Nitijela is the parliament of the Republic of the Marshall Islands, a unicameral
    legislature whose members are elected from the country's electoral districts.
  url: https://www.rmiparliament.org/
  country: mh
  official: true
