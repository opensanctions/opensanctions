title: Malaysia MOHA Sanctions List
entry_point: crawler.py
prefix: mymoha
coverage:
  frequency: weekly
  start: "2023-07-11"
load_statements: true
ci_test: false
summary: >
  The Malaysian Home Affairs list designates those found to be involved in acts
  of terrorism.
description: |
  > This list is made by the Minister of Home Affairs under the section 66B (1) of
  > the Anti-Money Laundering, Anti-Terrorism Financing and Proceeds From Illegal
  > Activities 2001 [Act 613]. Under section 66B (1) of the Act 613,
  >
  > Where the Minister of Home Affairs is satisfied on information given to him by
  > a police officer that:
  >
  > (a) an entity has knowingly committed, attempted to commit, participated in
  > committing or facilitated the commission of, a terrorist act; or
  > (b) an entity is knowingly acting on behalf of, at the direction of, or in
  > association with, an entity referred to in paragraph (a),
  >
  > the Minister of Home Affairs may, by order published in the Gazette, declare the
  > entity to be a specified entity.
publisher:
  name: Ministry of Home Affairs (Kementerian Dalam Negeri)
  acronym: MOHA
  description: |
    Sanctions in the ministry are managed by the division responsible for
    Countering Financing of Terrorism.
  url: https://www.moha.gov.my/utama/index.php/en
  country: my
  official: true
url: https://www.moha.gov.my/utama/index.php/en/component/content/article/350-list-of-ministries-of-home-affairs
data:
  url: https://www.moha.gov.my/utama/index.php/en/component/content/article/350-list-of-ministries-of-home-affairs
  format: XML
  lang: eng
http:
  user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/42.0.2311.90 Safari/537.36" (zavod; opensanctions.org)
dates:
  formats: ["%d %B %Y", "%d %b %Y", "%d.%m.%Y"]
tags:
  - list.sanction

assertions:
  min:
    schema_entities:
      Person: 55
      Organization: 20
  max:
    schema_entities:
      Person: 100
      Organization: 50

lookups:
  # The XML labels each field with its column number and heading. Both the
  # individual and the group table are mapped here; headings are unique across
  # the two because they carry the (differing) column number.
  columns:
    map:
      # Individuals
      "(1) No.": internal_no
      "(2) Reference": reference_no
      "(3) Name": name
      "(4) Title": title
      "(5) Designation": position
      "(6) Date of Birth": birth_date
      "(7) Place of Birth": birth_place
      "(8) Other Names": other_name
      "(9) Nationality": citizenship
      "(10) Passport Number": passport_no
      "(11) Identification Card Number": id_no
      "(12) Address": address
      "(13) Date 0f Listed": date_listed  # sic, typo in the source
      "(13) Date of Listed": date_listed
      # Groups
      "(4) Alias": alias
      "(5) Other Name": other_name
      "(6) Address": address
      "(7) Date of Listed": date_listed
  type.country:
    options:
      - match: 'Philippines (Permanent Resident in Malaysia)'
        value: Philippines
  type.address:
    options:
      - match: Iraq Syria
        values: ["Iraq", "Syria"]
      - match: Algeria Mali Mauritania Morocco Niger Tunisia
        values:
          - Algeria
          - Mali
          - Mauritania
          - Morocco
          - Niger
          - Tunisia
  type.name:
    options:
      # Two names run together without the pipe the source uses elsewhere.
      - match: Le Groupe Salafiste pour La Prédication et le Combat (GSPC) Salafist Group for Call and Combat
        values:
          - Le Groupe Salafiste pour La Prédication et le Combat (GSPC)
          - Salafist Group for Call and Combat
  type.date:
    options:
      - match: 20.2.1976 13.2.1975 15.2.1976 7.1.1977
        values:
          - 1976-02-20
          - 1975-02-13
          - 1976-02-15
          - 1977-01-07
