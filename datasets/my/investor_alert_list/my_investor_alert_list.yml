title: Malaysia Securities Commission Investor Alert List
entry_point: crawler.py
prefix: my-inval
coverage:
  frequency: daily
  start: 2024-06-13
load_statements: true
summary: >
  Individuals and entities provide investment services without registration with
  the Malaysia Securities Commission.
description: |
  This list contains the names of entities and individuals providing investment services
  despite not being registered with, and authorised to do so by Malaysia Securities
  Commission.

  Some entities in this list may impersonate legitimate entities which
  are described as “potential clone”.
publisher:
  name: Suruhanjaya Sekuriti Malaysia
  acronym: SC
  description: |
    The Securities Commission Malaysia is a Malaysian statutory body with
    responsibility for the development and regulation of capital markets
    in the country.
  url: https://www.sc.com.my
  official: true
  country: "my"
url: "https://www.sc.com.my/investor-alert-list"
data:
  url: https://www.sc.com.my/investor-alert-list
  format: HTML
  lang: eng

assertions:
  min:
    schema_entities:
      LegalEntity: 1400
  max:
    schema_entities:
      LegalEntity: 3000

lookups:
  # Rows the source publishes with an empty name column, keyed on the remark.
  # A matching option allows the row to be emitted without a name, described
  # only by the remark it was published with. Don't supply a name here - the
  # point is to publish what the source says, not to infer who is meant.
  no_name:
    options:
      # A clone of the SC-licensed Level 17 Capital Sdn Bhd, but the source
      # doesn't say what name the clone operates under: it is listed under the
      # letter L (group ",L,") with a fake certificate branded "Level 17
      # Capital" (fake-cert-L17.jpg) and no name of its own.
      - contains: "Misusing the name and credentials of Level 17 Capital Sdn Bhd (eCMSL/A0385/2023)"
  type.url:
    lowercase: true
    options:
      - match:
          - N/A
          - all pages relating to Futurebarrel on facebook
          - Potential clone entity – ASNB (Amanah Saham Nasional Berhad) Telegram Group / ASNB Investment Malaysia
          - Kakak safety Trader
          # A query string that got separated from its URL, so it can't be reassembled.
          - lang=&ABtestName=ktteam&aff_sub=fdd2ke8t0mk&affiliate=&aff_sub6=2137888407.1739076551
        value: null
      # An "I" typed instead of the "|" that separates this from the next URL.
      - match: "https://webull-trade.com I"
        value: https://webull-trade.com
      - match: "www.cambridgecapitaltrading. comwww.dubalex.com"
        values:
          - www.cambridgecapitaltrading.com
          - www.dubalex.com
      - match: "(https://telegram.org/k/#@pelaburanrakiyat25"
        value: "https://telegram.org/k/#@pelaburanrakiyat25"
      - match: "(https://t.me/ASBMALAYSIA1"
        value: https://t.me/ASBMALAYSIA1
      - match: "(https://t.me/XMBROKERSUCCES27"
        value: https://t.me/XMBROKERSUCCES27
      - match: "https:islamicinc.asia/"
        value: https://islamicinc.asia/
      - match: "http://www.xeraya-capital.com (clone website)"
        value: http://www.xeraya-capital.com
  type.address:
    options:
      - match: ","
        value: null
