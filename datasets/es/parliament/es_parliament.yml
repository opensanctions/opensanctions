title: Spain Members of Parliament
entry_point: crawler.py
prefix: es-par
load_statements: true
ci_test: false  # No Zyte API in CI
coverage:
  frequency: weekly
  start: 2025-07-29
summary: >
  Current members of both chambers of the Spanish Parliament (Cortes Generales),
  including Senators and Deputies.
description: |
  This dataset lists individuals currently serving in the two chambers of the Spanish Parliament:
  the Congress of Deputies (Congreso de los Diputados) and the Senate (Senado).
  It includes personal details, political affiliations, roles, and parliamentary positions.
publisher:
  name: Cortes Generales
  name_en: Spanish Parliament
  official: true
  description: |
    The Cortes Generales is Spain’s bicameral legislature, composed of the lower house
    (Congress of Deputies) and the upper house (Senate). This dataset combines official data
    from both chambers.
  country: es
  url: http://www.cortesgenerales.es
tags:
  - list.pep
url: http://www.cortesgenerales.es/
data:
  url: http://www.cortesgenerales.es/
  format: html
  lang: spa
http:
  user_agent: zavod (https://opensanctions.org/)
dates:
  formats: ["%d/%m/%Y", "%b %d %Y"]

assertions:
  min:
    schema_entities:
      # Expect 266 senators
      # Expect 348 deputies
      # = 614
      # Make sure this is high enough to catch if all senator XML files are suddenly empty
      Person: 580

lookups:
  columns:
    options:
      - match: nombre
        value: first_name
      - match: apellidos
        value: last_name
      - match: apellidosNombre
        value: full_name
      - match: codParlamentario
        value: parliament_member_id
      - match: fchAlta
        value: start_date
      - match: fchBaja
        value: end_date
      - match: formacion
        value: party
      - match: genero
        value: gender
      - match: grupo
        value: parliamentary_group
      - match: idCircunscripcion
        value: constituency_id
      - match: idLegislatura
        value: legislative_term_id
      - match: nombreCircunscripcion
        value: constituency_name
  type.name:
    options:
      - match: 'VICEPRESIDENTA SEGUNDA, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'VICEPRESIDENTA SEGUNDA, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'VOCAL, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'VOCAL, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'VICEPORTAVOZ, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'VICEPORTAVOZ, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'PRESIDENTE, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'PRESIDENTE, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'PORTAVOZ, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'PORTAVOZ, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'SECRETARIA PRIMERA, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'SECRETARIA PRIMERA, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'VICEPRESIDENTE PRIMERO, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'VICEPRESIDENTE PRIMERO, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      - match: 'SECRETARIO SEGUNDO, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME, Y RESPECTO A LOS PRESUNTOS DELITOS RELATIVOS A LA CORRUPCIÓN QUE TENGAN UNA RELACIÓN, DIRECTA O INDIRECTA, O CONEXIÓN CON LAS MISMAS'
        value: 'SECRETARIO SEGUNDO, COMISIÓN DE INVESTIGACIÓN SOBRE LOS CONTRATOS, LICENCIAS, CONCESIONES, AYUDAS Y OTRAS OPERACIONES DEL GOBIERNO Y DEL SECTOR PÚBLICO, RELACIONADAS CON LA INTERMEDIACIÓN DE KOLDO GARCÍA IZAGUIRRE Y CON LAS DEMÁS PERSONAS VINCULADAS A LA TRAMA INVESTIGADA EN LA OPERACIÓN DELORME'
      # English translations of the same over-length commission names, truncated
      # after "Operation Delorme" like the Spanish originals above.
      #
      # The English name is produced by the LLM translation in make_position
      # (translate_name=True), so its exact wording drifts whenever the
      # translation cache expires and the label is translated afresh. Matching
      # on literal translations therefore produced a new over-length warning —
      # and another near-duplicate name on the same Position — every few runs.
      # Match on the role prefix plus the two stable anchors of this commission
      # ("Koldo García Izaguirre" and a "Delorme," followed by the corruption
      # clause that makes the label over-length) instead, and pin each role to
      # one canonical English name. The Position id is derived from the
      # untranslated Spanish name and is unaffected.
      - regex: '(?i:^First Vice[- ]?President, .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'First Vice President, Commission of Inquiry into Contracts, Licenses, Concessions, Aid and Other Operations of the Government and Public Sector, Related to the Mediation of Koldo García Izaguirre and Other Persons Linked to the Scheme Investigated in Operation Delorme'
      - regex: '(?i:^Second Vice[- ]?President, .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'Second Vice President, Commission of Investigation on Contracts, Licenses, Concessions, Aids, and Other Operations of the Government and the Public Sector, Related to the Mediation of Koldo García Izaguirre and with Other Persons Linked to the Network Investigated in Operation Delorme'
      - regex: '(?i:^First Secretary, .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'First Secretary, Commission of Investigation on the Contracts, Licenses, Concessions, Aid and Other Operations of the Government and the Public Sector, Related to the Mediation of Koldo García Izaguirre and with Other Persons Linked to the Scheme Investigated in Operation Delorme'
      - regex: '(?i:^Second Secretary, .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'Second Secretary, Commission of Investigation on Contracts, Licenses, Concessions, Aids, and Other Government and Public Sector Operations, Related to the Mediation of Koldo García Izaguirre and Other Persons Linked to the Network Investigated in the Operation Delorme'
      - regex: '(?i:^Spokes(?:person|man|woman), .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'Spokesperson, Commission of Inquiry on Contracts, Licenses, Concessions, Aid, and Other Operations of the Government and Public Sector Related to the Intermediation of Koldo García Izaguirre and Other Persons Connected to the Network Investigated in Operation Delorme'
      - regex: '(?i:^(?:Deputy|Vice)[- ]?Spokes(?:person|man|woman), .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'Deputy Spokesperson, Commission of Inquiry into Contracts, Licenses, Concessions, Aids and Other Government and Public Sector Operations Related to the Mediation of Koldo García Izaguirre and Other Individuals Linked to the Network Investigated in the Operation Delorme'
      - regex: '(?i:^Member, .*Koldo Garc[ií]a Izaguirre.*Delorme,)'
        value: 'Member, Commission of Investigation on Contracts, Licenses, Concessions, Aids and Other Operations of the Government and Public Sector, Related to the Mediation of Koldo García Izaguirre and with Other Persons Linked to the Network Investigated in the Operation Delorme'
  type.gender:
    options:
      - match: 1
        value: male
      - match: 2
        value: female
