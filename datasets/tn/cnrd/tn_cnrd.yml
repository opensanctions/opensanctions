  name: المجلس الوطني للجهات والأقاليم
  name_en: National Council of Regions and Districts
  acronym: CNRD
  description: >
    The National Council of Regions and Districts is the upper chamber of the Tunisian
    parliament, made up of representatives of the country's regional and district
    councils.
  url: https://www.cnrd.tn/
  country: tn
  official: true
