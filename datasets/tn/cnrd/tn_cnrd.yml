  frequency: monthly
load_statements: true
ci_test: false  # LLM translation
summary: Upper chamber indirectly elected from Tunisia's regional and district councils
description: |
  Current members of the National Council of Regions and Districts (المجلس الوطني للجهات
  والأقاليم), the upper chamber of Tunisia's bicameral parliament under the
  2022 constitution. Its members are elected indirectly for a five-year term by the
  regional councils from among their own members and by the district councils.
  Alongside the Assembly of the Representatives of the People, it must approve the
  state budget and regional and national development plans.
url: https://www.cnrd.tn/
