title: Tunisia Members of the National Council of Regions and Districts
entry_point: crawler.py
prefix: tn-cnrd
coverage:
  frequency: monthly
load_statements: true
ci_test: false  # LLM translation
summary: Upper chamber indirectly elected from Tunisia's regional and district councils
description: |
  Current members of the National Council of Regions and Districts (المجلس الوطني للجهات
  والأقاليم), the upper chamber of Tunisia's bicameral parliament under the
  2022 constitution. Its 77 members are elected indirectly for a five-year term: three by
  each of the 24 regional councils from among their members, and one by each of the five
  district councils. Alongside the Assembly of the Representatives of the
  People, it must approve the state budget and regional and national development plans.
url: https://www.cnrd.tn/
publisher:
  name: المجلس الوطني للجهات والأقاليم
  name_en: National Council of Regions and Districts
  acronym: CNRD
  description: >
    The National Council of Regions and Districts is the upper chamber of the Tunisian
    parliament, made up of representatives of the country's regional and district
    councils.
  url: https://www.cnrd.tn/
  country: tn
  official: true
