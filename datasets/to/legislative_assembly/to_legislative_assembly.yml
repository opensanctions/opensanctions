summary: >-
  Unicameral legislature of People's and Nobles' Representatives
description: |
  Current members of the Legislative Assembly of Tonga (Fale Alea), the country's unicameral
  national legislature. It is made up of People's Representatives, directly elected from
  single-member constituencies, and Nobles' Representatives, elected by the country's
  hereditary nobles; both sit as members of the Assembly and hold the country's legislative
  power, including passing laws and approving the budget.
