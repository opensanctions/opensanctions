title: US OFAC Consolidated (non-SDN) List
entry_point: ofac_advanced.py
prefix: ofac
coverage:
  frequency: daily
  start: "2015-12-05"
  schedule: "0 */2 * * *"
deploy:
  memory: 1300Mi
  memory_limit: "2Gi"
  cpu: "200m"
load_statements: true
summary: >
  OFAC is providing all of its non-SDN sanctions lists in a consolidated set
  of data called "the Consolidated Sanctions List".
description: |
  In order to make it easier to comply with OFAC's sanctions regulations, OFAC is
  offering all of its non-SDN sanctions lists in a consolidated set of data
  files called "the Consolidated Sanctions List".

  In the future, if OFAC creates a new non-SDN style list, the office will add
  the new data associated with that list to these consolidated data files if
  appropriate. While the consolidated sanctions list data files are not part of OFAC's
  list of Specially Designated Nationals and Blocked Persons "the SDN List," the records
  in these consolidated files may also appear on the SDN List.
publisher:
  name: Office of Foreign Assets Control
  acronym: OFAC
  description: >
    OFAC is a divison of the United States Department of the Treasury that administers
    and enforces economic and trade sanctions based on US foreign policy and national
    security goals against targeted foreign countries and regimes, terrorists,
    international narcotics traffickers, those engaged in activities related to the
    proliferation of weapons of mass destruction, and other threats to the national
    security, foreign policy or economy of the United​ States.
  country: us
  url: https://www.treasury.gov/
  official: true
tags:
  - list.sanction
  - juris.us
  - issuer.west
  - sector.maritime
url: https://www.treasury.gov/resource-center/sanctions/Pages/default.aspx
data:
  url: https://www.treasury.gov/ofac/downloads/sanctions/1.0/cons_advanced.xml
  format: XML
  lang: eng

assertions:
  min:
    schema_entities:
      Address: 440
      Organization: 300
      Security: 200
      Person: 70
      Company: 4
    # Set at roughly a quarter of the production fill rate: low enough that a
    # shift in the shape of the source data doesn't hold up the release, high
    # enough to catch a crawler that stopped parsing a field altogether.
    property_fill_rate:
      Person:
        birthDate: 0.25
      Organization:
        country: 0.25
        address: 0.25
      Security:
        issuer: 0.25
        isin: 0.17
      Sanction:
        program: 0.25
        # Guards against a program mapping regression: `program` stays filled from
        # the source tag even when no tag resolves to a program key.
        programId: 0.25
  max:
    schema_entities:
      Address: 1030
      Organization: 720
      Security: 460
      Person: 160
      Company: 50

# Consolidated List
# SDN List
lookups:
  # Programs identify the legal authority, not the list that delivered the
  # designation. The single-authority lists are keyed by list name, because their
  # entries carry the same tags as SDN entries and the tag alone cannot tell them
  # apart. The multi-authority lists (NS-MBS, CAPTA) are keyed by the per-entry
  # program tag. An unmapped tag warns and leaves programId unset, so newly
  # introduced authorities surface in the logs. cf. #4980
  sanction.program:
    options:
      # Single-authority lists: the list name already names the authority.
      - match: Sectoral Sanctions Identifications List
        value: US-SSI
      - match: Non-SDN CMIC List
        value: US-NS-CMIC
      - match: Non-SDN Palestinian Legislative Council List
        value: US-NS-PLC
      - match: FSE List
        value: US-FSE
      # Authority tags carried by NS-MBS and CAPTA entries.
      - match: HKAA
        # Hong Kong Autonomy Act designations moved to the NS-MBS list when the
        # EO 13936 national emergency expired in July 2026; the authority stays US-HONGKONG.
        value: US-HONGKONG
      - match: RUSSIA-EO14024
        value: US-RUSHAR
      - match: UKRAINE-EO13662
        value: US-UKRRUS-REL
      - match: CAATSA - RUSSIA
        value: US-CAATSA
      - match: BURMA-EO14014
        value: US-BURMA
      - match: ILLICIT-DRUGS-EO14059
        value: US-NARCO
      - match: "561-Related"
        # Foreign financial institutions restricted under the Iranian Financial
        # Sanctions Regulations, 31 CFR 561.
        value: US-IRAN
  script.lang:
    options:
      # - match: Arab
      #   value: ara
      # - match: Armn
      #   value: hye
      - match: Hans
        value: zho
      - match: Hant
        value: zho
      - match: Cyrl
        value: rus # cough
      # - match: Geor
      #   value: kat
      # - match: Grek
      #   value: ell
      # - match: Hang
      #   value: kor
      # - match: Hebrew
      #   value: heb
      # - match: Japanese
      #   value: jpn
      # - match: Korean
      #   value: kor
  type.address:
    lowercase: true
    options:
      - match:
          - Russia
          - Turkey
        value: null
      - match: Moscow
        value: Moscow
      - match: Oja
        value: Oja
  type.email:
    options:
      - match: PRIYEMNAYA@YGDU
        value: null
  type.gender:
    lowercase: true
    normalize: true
    options:
      - match: MALE
        value: male
  type.identifier:
    options:
      # Re-map invalid ISINs to generic regNr:
      - match:
          - BRC1EODR004 # CNOOC LIMITED
          - CND10002K094 # CHINA COMMUNICATIONS CONSTRUCTION COMPANY LIMITED
          - CND10002G601 # CHINA COMMUNICATIONS CONSTRUCTION COMPANY LIMITED
        prop: registrationNumber
