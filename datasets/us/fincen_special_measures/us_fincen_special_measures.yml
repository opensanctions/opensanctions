title: "US FinCEN 311 and 9714 Special Measures"
entry_point: crawler.py
prefix: us-fincen
load_statements: true
coverage:
  frequency: daily
  start: 2024-07-26
summary: >
  Foreign banks, jurisdictions and transaction classes FinCEN has found to be
  of primary money laundering concern
description: |
  FinCEN issues special measures under Section 311 of the USA PATRIOT Act and
  Section 9714 of the Combating Russian Money Laundering Act (Public Law 116-283).
  A finding designates a foreign jurisdiction, financial institution or class
  of transactions as being of primary money laundering concern; a notice of
  proposed rulemaking proposes one or more special measures; a final rule or
  order imposes them, most often a prohibition on US financial institutions
  maintaining correspondent accounts for, or transmitting funds involving, the
  target.

  The targets in FinCEN's overview table are `sanction` while a final rule or
  order is in force and `reg.warn` while only a finding or proposed rule
  exists. Rescinded measures are kept with the end date of their sanction
  record and no risk topic.

  The dataset also includes the addresses, aliases and identifiers stated in
  the linked rulemaking documents, the individually named members of
  class-based measures and affiliates the rules define as part of a target
  (which share the target's status), and the subsidiaries, owners and other
  parties the documents name in connection with a target. Those parties are
  not designated by FinCEN; they are tagged as persons of interest (`poi`)
  for as long as the measure is live, with FinCEN's own wording quoted in
  their notes.
tags:
  - sector.banking
  - list.sanction
  - sector.financial
  - issuer.west
url: https://www.fincen.gov/resources/statutes-and-regulations/311-and-9714-special-measures
publisher:
  name: Financial Crimes Enforcement Network
  acronym: FinCEN
  official: true
  description: |
    FinCEN, a bureau of the US Treasury, collects and analyzes financial transaction information to combat money laundering and
    terrorist financing.
  country: us
  url: https://www.fincen.gov
data:
  url: https://www.fincen.gov/resources/statutes-and-regulations/311-and-9714-special-measures
  format: html
dates:
  formats: ["%m/%d/%Y"]

lookups:
  target_type:
    options:
      - match:
          - "Burma****"
          - "Democratic People’s Republic of Korea"
          - "Islamic Republic of Iran"
          - "Nauru"
          - "Ukraine"
        value: PublicBody
  clean_name:
    # Names in the overview table that carry inline annotations. The raw
    # string stays the entity ID and the details.csv join key; these
    # overrides only clean up the emitted properties. Trailing asterisk
    # footnote markers (e.g. "Burma****") are stripped in code.
    options:
      - match: "Commercial Bank of Syria (Includes Syrian Lebanese Commercial Bank)*****"
        name: "Commercial Bank of Syria"
        notes: "Includes Syrian Lebanese Commercial Bank"
      - match: "Infobank (Includes Belmetalnergo); renamed Trustbank ***"
        name: "Infobank"
        alias: "Trustbank"
        notes: "Includes Belmetalnergo"
  skip_entity:
    # Rows that name a class of transactions, not an entity we can represent.
    # The class itself is not emitted; only the members named in the linked
    # documents (details.csv rows) are.
    options:
      - match:
          - "Convertible Virtual Currency Mixing"
          - "Mexican Gambling Establishments"
        value: true
assertions:
  min:
    schema_entities:
      PublicBody: 5
      Company: 280
      Person: 30
      Organization: 10
  max:
    schema_entities:
      PublicBody: 25
      Company: 400
      Person: 70
      Organization: 40

config:
  # Subsidiaries are linked to the target by Ownership only; the graph analyzer
  # (ann_graph_topics) then derives sanction.control / sanction.linked for the
  # subsidiaries of a `sanction` target. It has no notion of the exclusions some
  # orders carry (e.g. Intercam's US affiliates), so those inherit the derived
  # topics too.
  discovery:
    # Handling "Unreviewed special measures document" warnings:
    #
    # The overview table links each measure's rulemaking documents (finding,
    # NPRM, final rule, rescission). Their content — addresses, aliases,
    # identifiers and named sub-entities — is mined by hand/agent into
    # details.csv (see README.md); the crawler never fetches the documents.
    # A warning means the table links a document that no details.csv row
    # cites and that is not listed below.
    #
    # 1. Fetch the document. For federalregister.gov links, take the document
    #    number from the URL and use the JSON API's raw_text_url
    #    (https://www.federalregister.gov/api/v1/documents/<docnum>.json,
    #    or .../public-inspection-documents/<docnum>.json for public-inspection
    #    links). For fincen.gov / govinfo.gov PDFs, download and run
    #    `pdftotext -layout <file> -`.
    # 2. Extract facts into details.csv rows citing the document URL exactly
    #    as it appears in the table — that marks the URL reviewed. Follow the
    #    column semantics in README.md: names and addresses verbatim, Notes as
    #    quoted sentences from the document, no topics (the crawler derives
    #    them). An affiliate the rule's definition of the target names gets a
    #    `target` row in addition to its `subsidiary` row.
    # 3. If the document names no addresses, aliases, identifiers or related
    #    entities (procedural notices, withdrawals), add its URL below with a
    #    one-line comment instead.
    # 4. federalregister.gov public-inspection URLs are replaced by
    #    /documents/ URLs once published: re-review the published version and
    #    move any details.csv citations / list entry to the new URL.
    reviewed_urls:
      # Dead links on the FinCEN site (404); the 2013 NPRM content for both
      # exchange houses is covered by their findings, which are mined.
      - https://www.fincen.gov/system/files/shared/311--ExchHouse-H-NPRMFinal.pdf
      - https://www.fincen.gov/system/files/shared/311--ExchHouse-R-NPRMFinal.pdf
      # Procedural revocation of the Ukraine designation; names no details.
      - http://edocket.access.gpo.gov/2003/pdf/03-9411.pdf
      # Procedural extensions/amendments of the CIBanco/Intercam/Vector
      # effective dates; name no addresses or related entities.
      - https://www.federalregister.gov/documents/2025/08/22/2025-16080/imposition-of-special-measures-prohibiting-certain-transmittals-of-funds-involving-cibanco-sa
      - https://www.federalregister.gov/public-inspection/2025-12973/imposition-of-special-measure-prohibiting-certain-transmittals-of-funds-cibanco-sa-institution-de
      - https://www.federalregister.gov/public-inspection/2026-07416/imposition-of-special-measure-prohibiting-certain-transmittals-of-funds-cibanco-sa-institucion-de
      # FBME supplement responding to comments on SAR data; no new details.
      - https://www.fincen.gov/system/files/federal_register_notices/2016-12-01/2016-28752.pdf
      # DPRK NPRM and final rule restate the jurisdiction-level finding and
      # name no individual North Korean entities (those are in the finding).
      - https://www.fincen.gov/system/files/shared/2016-13037(DPRK_NPRM).pdf
      - https://www.fincen.gov/system/files/shared/2016-27049.pdf
      # Procedural BPA fifth-special-measure NPRM; no details beyond BPA.
      - https://www.fincen.gov/system/files/shared/BPA_NPRM.pdf
      # Procedural withdrawals of the Nauru and Liberty Reserve findings.
      - https://www.fincen.gov/system/files/shared/Section311_WithdrawalNauru.pdf
      - https://www.fincen.gov/system/files/shared/Withdrawal_LR.pdf
