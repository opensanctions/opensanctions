load_statements: true
ci_test: false  # Zyte is not available in CI
summary: >
  Providers, individuals and entities excluded from Idaho's Medicaid program.
description: |
  The Idaho Department of Health and Welfare publishes a list of providers, individuals,
  and entities that are excluded from participating in the Idaho Medicaid program. The
  list only includes exclusions issued by the Department, not federal exclusions or
  exclusions by other states. It is updated when a new exclusion is added or a provider
  is reinstated.

  Excluded providers are not reinstated automatically: an exclusion stays in force until
  a reinstatement date is listed, even after the provider has become eligible to apply
  for reinstatement.
