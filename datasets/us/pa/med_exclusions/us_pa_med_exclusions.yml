title: US Pennsylvania Medicheck list
entry_point: crawler.py
prefix: us-medpa
coverage:
  schedule: "32 4 1,15 * *"
  start: "2024-10-04"
load_statements: true
summary: >
  Medical providers who are precluded from participation in the Medical Assistance Program
description: |
  The Medicheck List dataset contains information about providers
  who are excluded from participating in the Medical Assistance (MA) Program. Healthcare
  providers are required by law to screen all employees, contractors, and entities against
  this list at the time of hire or contracting and perform monthly checks thereafter.
tags:
  - sector.medical
  - sector.usmed.debarment
publisher:
  name: Department of Human Services
  description: >
    The Pennsylvania Department of Human Services (DHS) is a state agency responsible for
    providing essential services and support to individuals and families in need, including
    healthcare, child welfare, and social assistance programs.
  acronym: DHS
  url: https://www.pa.gov/en/agencies/dhs.html
  official: true
  country: "us"
url: https://www.pa.gov/agencies/dhs/report-fraud/medicheck-list
data:
  url: https://www.humanservices.dhs.pa.gov/Medchk/MedchkSearch/Medchk?target=_blank
  format: CSV
dates:
  formats: ["%m/%d/%Y %H:%M:%S"]

assertions:
  min:
    schema_entities:
      Company: 200
      Person: 4500
  max:
    schema_entities:
      Company: 400
      Person: 6000

lookups:
  # The CAO column only carries a Pennsylvania county, or an out-of-state marker
  # with a state code. Records with an empty CAO fall back to the bare state code
  # "PA", and the out-of-state markers without parentheses leave a bare state code
  # too. These are real places, so they are curated here rather than dropped.
  type.address:
    options:
      - match: PA
        value: PA
      - match: NJ
        value: NJ
      - match: DE
        value: DE
      - match: FL
        value: FL
      - match: GA
        value: GA
      - match: IL
        value: IL
      - match: MD
        value: MD
      - match: MO
        value: MO
      - match: NY
        value: NY
      - match: TX
        value: TX
      - match: WV
        value: WV
      # "Out of State WVA" - non-standard abbreviation of West Virginia.
      - match: WVA
        value: WV
      # "Out of State -MO" - stray hyphen left over from the marker.
      - match: -MO
        value: MO
  type.identifier:
    options:
      - match:
          - None
          - N/A
        value: null
