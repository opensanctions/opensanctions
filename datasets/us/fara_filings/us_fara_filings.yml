title: US Foreign Agents Registration Act list
url: https://efile.fara.gov/ords/fara/f?p=107:21
entry_point: crawler.py
prefix: us-fara
ci_test: false
load_statements: false
exports:
  - statistics.json
  - entities.delta.json
  - entities.ftm.json
  - names.txt
  - senzing.json
coverage:
  frequency: weekly
  start: 2024-07-29
summary: >
  Entities and individuals registered under the Foreign Agents Registration Act (FARA).
description: |
  The Foreign Agents Registration Act (FARA) was established in 1938. FARA mandates that
  certain agents of foreign principals engaged in political or other specified activities
  must regularly disclose their relationship with the foreign principal, as well as their
  activities, finances, and expenditures related to those activities. This disclosure allows
  the government and the American people to assess the activities of these individuals as
  foreign agents.
publisher:
  name: United States Department of Justice
  acronym: DOJ
  official: true
  description: |
    The United States Department of Justice is a federal executive department of the U.S.
    government tasked with the enforcement of federal law and administration of justice in
    the United States. It's led by the U.S. Attorney General, is dedicated to upholding the
    rule of law, ensuring safety, and protecting civil rights. With over 115,000 employees and
    more than 40 component organizations, the Department operates from its headquarters in
    Washington, D.C., and maintains field offices across all U.S. states and territories, as
    well as in over 50 countries worldwide.
  country: us
  url: https://www.justice.gov/

data:
  url: https://efile.fara.gov/ords/fara/f?p=API:BULKDATA
  format: XML

dates:
  formats: ["%m/%d/%Y"]

assertions:
  min:
    schema_entities:
      LegalEntity: 18000
  max:
    schema_entities:
      LegalEntity: 25000

lookups:
  type.country:
    options:
      - match:
          - INTERNATIONAL
          - UNKNOWN
          - NETHERLANDS ANTILLES
          - VIRGIN ISLANDS
          - GUADELOUPE & MARTINIQUE
          - CHANNEL ISLANDS
          - SAHARAWI ARAB DEMOCRATIC REPUBLIC
          - BRITISH WEST INDIES
          - SPANISH SAHARA
          - SULU AND NORTH BORNEO
          - UNITED KINGDOM OF CORALLAND
          - SOUTH MOLUCCAS REPUBLIC OF
          - COMORO  ISLANDS
          - PORTUGUESE TIMOR
          - ST. EUSTATIUS
          - UNITED STATES MISCELLANEOUS CARIBBEAN ISLANDS
          - DAHOMEY
          - MUSCAT
        value: null
      - match: WEST BERLIN
        value: DE
      - match: KOSOVA
        value: XK
      - match:
          - BOPHUTHATSWANA
          - TRANSKEI
          - CISKEI
          - VENDA
        value: ZA
      - match: CEYLON (SRI LANKA)
        value: LK
      - match: BIAFRA
        value: NG
      - match:
          - SOUTHERN YEMAN
          - YEMEN PEOPLES DEMOCRATIC REPUBLIC OF YEMEN
        value: YE
      - match: TAHITI
        value: PF
      - match: ST. EUSTATIU
        value: NL
      - match: CENTRAL AND SOUTHERN LINE ISLANDS
        value: KI
      - match: BRITISH SOLOMON ISLANDS
        value: SB
      - match: SOUTHWEST AFRICA
        value: NA
      - match: COTE D'IVOIRE (IVORY COAST)
        value: CI
  type.name:
    options:
      - match: 5480
        value: null
  type.address:
    # Identity lookups which mark these very short addresses as curated, so that
    # they bypass the "looks too short for an address" smell check. In each case
    # the source record supplies only a single address component, and the value
    # is a real place rather than a parsing artefact.
    options:
      # Foreign principal/registrant rows where State is the only populated
      # address field. These are US state and territory postal codes.
      - match: "CA"
        value: "CA"
      - match: "CT"
        value: "CT"
      - match: "DC"
        value: "DC"
      - match: "DE"
        value: "DE"
      - match: "FL"
        value: "FL"
      - match: "GA"
        value: "GA"
      - match: "MD"
        value: "MD"
      - match: "MI"
        value: "MI"
      - match: "NC"
        value: "NC"
      - match: "NJ"
        value: "NJ"
      - match: "NY"
        value: "NY"
      - match: "PR"
        value: "PR"
      - match: "TX"
        value: "TX"
      - match: "WA"
        value: "WA"
      # Rows where Address_1 holds only a city name.
      - match: "Ayr"  # Town in South Ayrshire, Scotland.
        value: "Ayr"
      - match: "Fez"  # City in Morocco.
        value: "Fez"
      - match: "Ufa"  # Capital of Bashkortostan, Russia.
        value: "Ufa"
      - match: "Ulm"  # City in Baden-Württemberg, Germany.
        value: "Ulm"
      - match: "Zug"  # Town and canton in Switzerland.
        value: "Zug"
      # Foreign principal rows whose Address_1 holds a data entry artefact and
      # no other address component. Sibling rows for the same registrants carry
      # real single-token cities (Tokyo, Shanghai, Baku, Seoul), so these are
      # truncation remnants rather than place names. Drop them.
      - match:
          - "0"  # Republic of Azerbaijan, registration 2759.
          - "5"  # Air China International, registration 5283.
          - "8"  # Fukuoka Prefectural Government, registration 5591.
          - "cs"  # Panama Canal Study Group, registration 3438.
          - "ka"  # Korea-U.S. Economic Council, registration 1967.
        value: null
