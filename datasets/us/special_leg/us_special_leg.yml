title: "US Special Legislative Exclusions"
entry_point: crawler.py
prefix: us-leg
manual_check:
  last_check: "2026-07-23"
  interval: 90
  message: >-
    Please check whether any amendments have been made to the legislation listed in this dataset.

    There does not seem to be a standard way to track amendments to these legislations, so manually
    searching for press releases announcing amendments to the individual legislations is required.
coverage:
  frequency: never
  schedule: "@weekly"
  start: 2024-05-02
load_statements: true
summary: >-
  A list of companies whose products and/or services are excluded from procurement by acts of Congress,
  and foreign persons sanctioned under the Iran, North Korea, and Syria Nonproliferation Act (INKSNA).
description: |
  This dataset lists entities named in legislation passed by the U.S. Congress to be
  excluded from procurement in specific circumstances, as well as foreign persons
  designated by the U.S. Department of State under INKSNA.

  Section 889 of the [John S. McCain National Defense Authorization Act for Fiscal
  Year 2019 (Public Law 115 - 232)](https://www.congress.gov/115/plaws/publ232/PLAW-115publ232.pdf)
  lists a number of entities from whom specific goods or services may not be
  procured by executive agencies. The same restrictions apply to to their subsidiaries
  and affiliates.

  Section 1286 of the [John S. McCain National Defense Authorization Act for Fiscal
  Year 2019 (Public Law 115 - 232)](https://www.congress.gov/115/plaws/publ232/PLAW-115publ232.pdf)
  required the DoD to publish lists of those foreign institutions that have been
  confirmed as engaging in problematic activity as described in Section 1286(c)(8)(A)
  of the law. These lists are included in the FY22, FY23, FY24, and FY25 versions.

  Section 5949 of the [James M. Inhofe National Defense Authorization Act for Fiscal Year 2023 (Public Law 117-263)](https://www.congress.gov/117/bills/hr7776/BILLS-117hr7776enr.pdf)
  lists a number of entities from whom specific goods or services may not be
  procured by executive agencies for use in critical systems. The same restrictions
  apply to to their subsidiaries, successors, and affiliates.

  Section 353 of the [Corrupt and Undemocratic Actors Report: 2023](https://www.state.gov/wp-content/uploads/2023/07/353-Report-Accessible-7.18.2023.pdf)
  reports Foreign Persons who have Knowingly Engaged in Actions that Undermine Democratic
  Processes or Institutions, Significant Corruption, or Obstruction of Investigations Into
  Such Acts of Corruption in El Salvador, Guatemala, Honduras, and Nicaragua.

  Since the December 2023 expiration of the Section 353 sanctions authority, individuals
  designated under the [act](https://www.state.gov/reports/section-353-corrupt-and-undemocratic-actors-report/) have been eligible to apply for new visas.
  [Source: Congressional Research Service](https://www.congress.gov/crs-product/IF12486)

  Section 154 of the [National Defense Authorization Act for Fiscal Year 2024 (Public Law 118-31)](https://www.congress.gov/118/plaws/publ31/PLAW-118publ31.pdf)
  prohibits the Department of Defense, beginning October 1, 2027, from obligating or expending
  funds to procure batteries produced by specified foreign entities or their successors.

  The [Iran, North Korea, and Syria Nonproliferation Act (INKSNA)](https://www.state.gov/bureau-of-arms-control-and-nonproliferation/nonproliferation-sanctions)
  (Pub. L. 109-353) authorises the U.S. Department of State to sanction foreign persons that
  have transferred WMD-applicable goods, services, or technology to or from Iran, North Korea,
  or Syria. Sanctions remain in effect for two years and include a ban on U.S. government
  procurement, exclusion from assistance programmes, and suspension of export licences.
  Designations are announced in the Federal Register.

  Additional pieces of legislation may be added to this dataset from time to time.

  The named entities exist only in the text of the individual acts, reports and
  Federal Register notices, none of which are machine-readable. The data is
  therefore maintained as reviewed CSV files in the OpenSanctions repository,
  one per act or designation authority.

  **This dataset is manually maintained and not automatically updated with new legislation.**
tags:
  - list.debarment
publisher:
  name: United States Congress
  acronym: Congress
  description: >
    The United States Congress is the legislature of the federal government of the
    United States.
  country: us
  url: https://www.congress.gov/
  official: true
url: https://github.com/opensanctions/opensanctions/tree/main/datasets/us/special_leg/data
data:
  url: https://github.com/opensanctions/opensanctions/tree/main/datasets/us/special_leg/data
  format: CSV
  lang: eng
dates:
  formats: ["%Y", "%B %Y", "%B %d, %Y"]

assertions:
  min:
    schema_entities:
      Person: 140
      Company: 125
  max:
    schema_entities:
      Person: 330
      Company: 290

lookups:
  type.country:
    options:
      - match: ROK
        value: KR
  sanction.program:
    options:
      - match: "Section 889 of the John S. McCain National Defense Authorization Act for Fiscal Year 2019 (Public Law 115 - 232)"
        value: US-MCCAIN-889
      - match: "Section 353(b) of the United States - Northern Triangle Enhanced Engagement Act"
        value: US-CORRUPT-353
      - match: "Section 154 of the United States National Defense Authorization Act for Fiscal Year 2024"
        value: US-NDAA-154
      - match: "Section 1286 of the John S. McCain National Defense Authorization Act for Fiscal Year 2019 (Public Law 115 - 232)"
        value: US-MCCAIN-1286
      - match: "Section 5949 of the James M. Inhofe National Defense Authorization Act for Fiscal Year 2023 (Public Law 117-263)"
        value: US-5949LIST
      - match: Nonproliferation Sanctions (ISN) - State Department
        value: US-DOS-ISN

config:
  # The dataset is maintained as the CSV files in data/ next to the crawler; edits
  # are made as pull requests against them. Each file holds exactly one act,
  # report or designation authority, and the crawler rejects a file that mixes
  # several. One row per entity per designation event: an entity named by
  # successive editions of the same list keeps one row per edition, keyed by
  # report-date, and an entity named by several acts appears in several files.
  # Within one edition an entity must appear only once, with all of its names
  # collected in `aliases`.
  #
  # All files share these columns:
  # - schema: Person or Company.
  # - name: the name exactly as printed in the act, report or notice.
  # - aliases: additional names, separated by semicolons.
  # - topics: `debarment` for procurement exclusions, `sanction` for INKSNA.
  # - program: the full title of the act or list, verbatim. Every value must be
  #   matched in the sanction.program lookup above; add a mapping when adding an act.
  # - authority: the body that issued the listing (e.g. United States Congress,
  #   U.S. Department of State).
  # - reason: the grounds for the listing, where the source states them.
  # - report-date: the edition the row was taken from (e.g. the fiscal year of a
  #   Section 1286 list). Emitted as the sanction's listing date.
  # - start-date / end-date: when the source gives explicit effective dates.
  #   INKSNA measures run for two years from the determination date.
  # - country: ISO 3166-1 alpha-2 code, or a value covered by the type.country lookup.
  # - notes: maintainer context, including judgment calls made while transcribing.
  # - source_url: the official act, report or notice the row was taken from;
  #   several URLs separated by semicolons.
  #
  # Adding a new act: create a new file in data/ with the same header, add the
  # program title to the sanction.program lookup with a new program key,
  # describe the act in `description`, and re-check `assertions`.
  #
  # Updating the Section 1286 list: follow SECTION_1286.md next to this file.
  #
  # Handling "Hash mismatch" warnings on the Federal Register API: the crawler
  # polls the API for new INKSNA determinations and rewrites fr_notices.csv.
  # Read each new notice, append one data/inksna.csv row per designated foreign
  # person, then commit fr_notices.csv and update the hash in crawler.py.
