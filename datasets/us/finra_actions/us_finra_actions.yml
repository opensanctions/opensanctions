title: US FINRA Enforcement Actions
entry_point: crawler.py
prefix: us-finra
coverage:
  frequency: weekly
  start: "2024-05-09"
load_statements: true
summary: >
  Firms and individuals that have faced FINRA disciplinary actions
description: |
  This dataset comprises firms and individuals against whom FINRA has taken
  disciplinary actions for violations of its rules, federal securities laws,
  rules, and regulations or the rules of the Municipal Securities Rulemaking Board.

  Documentation of disciplinary actions found here can include official
  complaints, decisions, and settlement agreements.
tags:
  - sector.financial
publisher:
  name: Financial Industry Regulatory Authority
  acronym: FINRA
  description: |
    FINRA is authorized by Congress to protect America's investors by making sure
    the broker-dealer industry operates fairly and honestly.
  url: https://www.finra.org/
  official: true
  country: "us"
url: "https://www.finra.org/rules-guidance/oversight-enforcement/disciplinary-actions"
data:
  url: https://data-portal.finra.org/exports/fda_export_all.xlsx
  format: XLSX
  lang: eng
ci_test: false
names:
  schema_rules:
    LegalEntity:
      reject_chars: "()/\""
      reject_strings:
        - "now known as"
        - "n/k/a"
  suggest_abbreviation_non_person_single_token_shorter_than: 5
  suffixes_strip:
    - ", Jr."
    - "Jr."
    - ", Jr"
    - "Jr"
    - ", Sr."
    - "Sr."
    - ", Sr"
    - "Sr"
    - ", II"
    - "II"
    - ", III"
    - "III"
    - ", IV"
    - "IV"
    - ", Esq."
    - "Esq."
    - ", Ph.D."
    - "Ph.D."
    - ", M.D."
    - "M.D."

assertions:
  min:
    schema_entities:
      LegalEntity: 14500
  max:
    schema_entities:
      LegalEntity: 17000

dates:
  formats: ["%m/%d/%Y"]
lookups:
  crd:
    options:
      # Swapped/duplicated column values: the CRD column holds a name whose
      # entity is already pinned via type.name
      - match:
          - "Shopoff Securities; Inc."
          - "Traderfield Securities Inc."
          - "Edward J. Rudiger Jr."
          - "Clifford R. Reid"
          - "Kelli A. Mezzatesta"
          - "Marc Harrison"
        value: null
      - match: "7581212`"
        value: "7581212"
      - match: "1066139)"
        value: "1066139"
      - match: "CRD 6972542"
        value: "6972542"
      - match: "5726300 and 5090765"
        values: ["5726300", "5090765"]
      # Renamed firm (First Clearing LLC n/k/a Wells Fargo Clearing Services LLC;
      # title: 'BD 17344 now 19616') — old and new BD numbers of the same entity.
      - match: "17344 19616"
        values: ["17344", "19616"]
  # These matches also pin legacy numeric entity IDs: the raw value is slugged
  # before this lookup is applied.
  type.name:
    options:
      # Map invalid names to the correct entity, manually looked up in the
      # "Case Summary" column on the source website.
      - match: 142866
        value: SHOPOFF SECURITIES, INC.
      - match: 20130
        value: Traderfield Securities Inc.
      - match: 2017054848101
        value: Jonathon Hartwig
      - match: 47263
        value: Reid & Rudiger LLC
      - match: 2118724
        value: Edward Joseph Rudiger Jr.
      - match: 4701170
        value: Kelli A. Mezzatesta
      - match: 1605568
        value: Marc Harrison
