title: US FINRA Enforcement Actions
entry_point: crawler.py
prefix: us-finra
coverage:
  frequency: weekly
  start: "2024-05-09"
load_statements: true
summary: >
  Firms and individuals that have faced FINRA disciplinary actions
description: |
  This dataset comprises firms and individuals against whom FINRA has taken
  disciplinary actions for violations of its rules, federal securities laws,
  rules, and regulations or the rules of the Municipal Securities Rulemaking Board.

  Documentation of disciplinary actions found here can include official
  complaints, decisions, and settlement agreements.
tags:
  - sector.financial
publisher:
  name: Financial Industry Regulatory Authority
  acronym: FINRA
  description: |
    FINRA is authorized by Congress to protect America's investors by making sure
    the broker-dealer industry operates fairly and honestly.
  url: https://www.finra.org/
  official: true
  country: "us"
url: "https://www.finra.org/rules-guidance/oversight-enforcement/disciplinary-actions"
data:
  url: https://data-portal.finra.org/exports/fda_export_all.xlsx
  format: XLSX
  lang: eng
ci_test: false
names:
  schema_rules:
    LegalEntity:
      reject_chars: "()/\""
      reject_strings:
        - "now known as"
        - "n/k/a"
  suggest_abbreviation_non_person_single_token_shorter_than: 5

assertions:
  min:
    schema_entities:
      LegalEntity: 14500
  max:
    schema_entities:
      LegalEntity: 17000

dates:
  formats: ["%m/%d/%Y"]
lookups:
  crd:
    options:
      # Swapped/duplicated column values: the Central Registration Depository (CRD) column holds a name whose
      # entity is already pinned via type.name
      - match:
          - "Shopoff Securities; Inc."
          - "Traderfield Securities Inc."
          - "Edward J. Rudiger Jr."
          - "Clifford R. Reid"
          - "Kelli A. Mezzatesta"
          - "Marc Harrison"
        value: null
      - match: "7581212`"
        value: "7581212"
      - match: "1066139)"
        value: "1066139"
      - match: "CRD 6972542"
        value: "6972542"
      - match: "5726300 and 5090765"
        values: ["5726300", "5090765"]
      # Renamed firm (First Clearing LLC n/k/a Wells Fargo Clearing Services LLC;
      # title: 'BD 17344 now 19616') — old and new BD numbers of the same entity.
      - match: "17344 19616"
        values: ["17344", "19616"]
  # Rows with empty name columns: the subject is only recorded in the document
  # title (name and CRD) or, for the older "_FDA_" documents, in the summary.
  title:
    options:
      - match: "2020067731001 Patrick Matlock CRD 5760255 Default Decision df (2023-1682299197914).pdf"
        name: Patrick Matlock
        crd: "5760255"
      - match: "2021071672302 Jordan Palmer John CRD  6924720 Default Decision df (2023-1682299197861).pdf"
        name: Jordan Palmer John
        crd: "6924720"
      - match: "2021070867702 David Hixon CRD 4707468 Default Decision df (2023-1682299197862).pdf"
        name: David Hixon
        crd: "4707468"
      - match:
          - "2008012096001_FDA_TX88240 (2019-1562624357456).pdf"
          - "2008012096001_FDA_D691939 (2019-1562374172921).pdf"
        name: Rebecca Amy Reichman  # name in Summary/PDF instead
      - match: "2008012102601_FDA_JX14466 (2019-1561963757956).pdf"
        name: Brenden Christopher Lilly  # name in Summary/PDF instead
      - match: "2006004969704_FDA_TX53431 (2019-1562377777264).pdf"
        name: Corbin T. Jones  # name, CRD in Summary/PDF instead
        crd: "44868964"
      - match: "2006004691101_FDA_D571400 (2019-1562563156316).pdf"
        name: Michelle Holton  # name in Summary/PDF instead
  # These matches also pin legacy numeric entity IDs: the raw value is slugged
  # before this lookup is applied.
  type.name:
    options:
      # Map invalid names to the correct entity, manually looked up in the
      # "Case Summary" column on the source website.
      - match: 142866
        value: SHOPOFF SECURITIES, INC.
      - match: 20130
        value: Traderfield Securities Inc.
      - match: 2017054848101
        value: Jonathon Hartwig
      - match: 47263
        value: Reid & Rudiger LLC
      - match: 2118724
        value: Edward Joseph Rudiger Jr.
      - match: 4701170
        value: Kelli A. Mezzatesta
      - match: 1605568
        value: Marc Harrison
