title: Czech Republic National Sanctions
entry_point: crawler.py
prefix: cz-san
coverage:
  frequency: daily
  start: "2024-05-20"
load_statements: true
summary: >
  Legal entities sanctioned by the Czech Republic Ministry of Foreign Affairs
description: |
  According to Act No. 1/2023 Coll. on restrictive measures against certain serious
  acts applied in international relations, the Ministry of Foreign Affairs maintains
  a national sanctions list and publishes it on its website. The entry on the
  national sanctions list mainly contains the entity's identification data,
  a description of the action punishable under the relevant European Union regulation,
  the scope of restrictive measures against the entity and the date of publication of the entry.
publisher:
  name: Ministr Zahraničních Věcí
  acronym: MZV
  description: Minister of Foreign Affairs
  url: https://mzv.gov.cz/jnp/cz/index.html
  official: true
  country: "cz"
tags:
  - list.sanction
  - list.sanction.eu
  - issuer.west
url: "https://mzv.gov.cz/jnp/cz/zahranicni_vztahy/sankcni_politika/sankcni_seznam_cr/vnitrostatni_sankcni_seznam.html"
data:
  # The sanctions list page only publishes a PDF; the machine-readable CSV is
  # linked from the ministry's open data section.
  url: https://mzv.gov.cz/jnp/cz/o_ministerstvu/otevrena_data/index_5.html
  format: CSV

dates:
  # All dates in the CSV columns are numeric. The dates stated in Czech prose in
  # the note on the status of an entry are extracted via the status_note lookup.
  formats: ["%d. %m. %Y", "%d.%m.%Y"]
assertions:
  min:
    schema_entities:
      Person: 15
      LegalEntity: 2
  max:
    schema_entities:
      Person: 40
      LegalEntity: 10
lookups:
  columns:
    normalize: true
    options:
      - match: 'Příjmení fyzické osoby/název právnické osoby/označení nebo název entity '
        value: last_name_or_entity_name
      - match: 'Jméno fyzické osoby '
        value: first_name
      - match: Stav zápisu
        value: entry_status
      - match: Poznámka ke stavu zápisu
        value: entry_status_note
      - match: 'Datum narození fyzické osoby '
        value: birth_date
      - match: 'Státní příslušnost fyzické osoby /sídlo právnické osoby '
        value: nationality_or_registered_office
      - match: Datum zápisu či jeho změny
        value: entry_or_amendment_date
      - match: Právní předpis zápisu
        value: entry_legal_regulation
      - match: 'Ustanovení předpisu Evropské unie, jehož skutkovou podstatu subjekt jednáním naplnil '
        value: eu_provision
      - match: 'Popis postižitelného jednání '
        value: offence_description
      - match: 'Uplatňovaná omezující opatření '
        value: restrictive_measures
  sanction.program:
    options:
      - match:
          - 'čl. 1 odst. 1 písm. e) a čl. 2 odst. 1 písm. g) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. d) bod iii) a iv) rozhodnutí Rady (SZBP) 2020/1999 ze dne 7. prosince 2020 o omezujících opatřeních proti závažnému porušování a zneužívání lidských práv, ve znění pozdějších předpisů'
          - 'čl. 1 odst. 1 písm. a) bodu iv) a odst. 1 písm. b) a čl. 2 odst. 1 písm. a) bod iv) a odst. 1 písm. b) rozhodnutí Rady (SZBP) 2024/2643 ze dne 8. října 2024 o omezujících opatřeních vzhledem k destabilizujícím činnostem Ruska, ve znění pozdějších předpisů'
          - 'čl. 2 odst. 1 písm. b) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. a) a b) a čl. 2 odst. 1 písm. a) a d) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. a) a čl. 2 odst. 1 písm. a) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. a), d) a e) a čl. 2 odst. 1 písm. a), f) a g) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 2 odst. 1 písm. f) a g) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. d) a e) a čl. 2 odst. 1 písm. f) a g) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
          - 'čl. 1 odst. 1 písm. a) a čl. 2 odst. 1 písm. a) rozhodnutí Rady (SZBP) 2014/145 ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny, ve znění pozdějších předpisů a tzv. asociační kritérium dle čl. 1 odst. 1 rozhodnutí'
          - 'čl. 1, odst. 1 písm. f) a h) a čl. 2 odst. 1 písm. h) a k) rozhodnutí Rady 2014/145/SZBP ze dne 17. března 2014 o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny, ve znění pozdějších předpisů'
        value: CZ-A1-2023COLL
      # legal basis under the 2580/2001 counter-terrorism framework, before and
      # after the 2026/456 amendment
      - match:
          - 'čl. 2 odst. 3 bod ii) nařízení Rady (ES) č. 2580/2001 ze dne 27. 12. 2021 o zvláštních omezujících opatřeních namířených proti některým osobám a subjektům s cílem bojovat proti terorismu, ve znění pozdějších předpisů, ve spojení s čl. 1 odst. 3 bodem iii) písm. k) společného postoje Rady 2001/931/SZBP ze dne 27. 12. 2001 o použití zvláštních opatření k boji proti terorismu, ve znění pozdějších předpisů'
          - 'čl. 2 odst. 3 ve spojení s čl. 1 písm. i) bod iii) písm. k) nařízení Rady (EU) 2026/456 ze dne 26. února 2026, kterým se mění nařízení (ES) č. 2580/2001 o zvláštních omezujících opatřeních namířených proti některým osobám a subjektům s cílem bojovat proti terorismu a zrušuje prováděcí nařízení (EU) 2025/1578 a (EU) 2026/420, a čl. 2 odst. 1 ve spojení s čl. 1 odst. 1 bod iii) písm. k) rozhodnutí Rady (SZBP) 2026/455 ze dne 26. února 2026 o omezujících opatřeních k boji proti terorismu, o zrušení článků 2, 3 a 3a společného postoje 2001/931/SZBP o uplatnění zvláštních opatření k boji proti terorismu a o zrušení rozhodnutí (SZBP) 2025/1577 a (SZBP) 2026/421'
        value: EU-TERR
  # Stav zápisu -> Status of the entry. The crawler warns about an unknown status.
  entry_status:
    normalize: true
    options:
      - match: platný
        value: valid
      - match: změněn
        value: amended
      - match: zrušen
        value: cancelled
  # Poznámka ke stavu zápisu -> Note on the status of the entry. It states the
  # dates on which an entry was cancelled (end_dates) or amended
  # (amendment_dates) in Czech prose, so they are extracted by hand rather than
  # parsed. The crawler warns about a note that isn't matched here.
  status_note:
    normalize: true
    options:
      - match: 'Zápis byl zrušen ke dni 24. února 2025 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2025/388.'
        end_dates: ["2025-02-24"]
      - match: 'Zápis byl zrušen ke dni  23. července 2026 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2026/1845.'
        end_dates: ["2026-07-23"]
      - match: 'Zápis byl zrušen ke dni 18. prosince 2023 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2023/2871.'
        end_dates: ["2023-12-18"]
      - match: 'Zápis byl zrušen ke dni 27. května 2024 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2024/1508.'
        end_dates: ["2024-05-27"]
      - match: 'Zápis byl zrušen ke dni 20. května 2025 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2025/966.'
        end_dates: ["2025-05-20"]
      - match: 'Zápis byl zrušen ke dni 15. července 2025 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2025/1443.'
        end_dates: ["2025-07-15"]
      # The note mentions the date twice: once as the date of the cancellation,
      # and once as the date of the EU decision that prompted it.
      - match: 'Zápis byl zrušen ke dni 23. října 2025 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2025/2036 ze dne 23. října 2025, kterým se mění rozhodnutí 2014/145/SZBP o omezujících opatřeních vzhledem k činnostem narušujícím nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny'
        end_dates: ["2025-10-23"]
      # Rogach's entry says it was cancelled in 2025, but it cites EU decision
      # 2026/1364, the entry itself only dates from 2026-03-30, and the PDF
      # version of the list says 2026, so the year is a typo in the CSV.
      - match: 'Zápis byl zrušen ke dni 15. června 2025 v souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), vzhledem k zařazení subjektu na sankční seznam Evropské unie rozhodnutím Rady (SZBP) 2026/1364.'
        end_dates: ["2026-06-15"]
      - match: 'V souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon), byl zápis pozměněn ke dni 25. 10. 2023 vzhledem k námitkovému řízení zahájeném podle § 9 sankčního zákona. Aktuální znění zápisu je uvedeno v platném zápisu.'
        amendment_dates: ["2023-10-25"]
      - match: 'V souladu s § 7 odst. 3 písm. a) zákona č. 1/2023 Sb., o omezujících opatřeních proti některým závažným jednáním uplatňovaných v mezinárodních vztazích (sankční zákon) byl zápis pozměněn ke dni 27. května 2024 a ke dni 26. června 2024, vzhledem k zařazení subjektu na sankční seznamy Evropské unie rozhodnutím Rady (SZBP) 2024/1508 a rozhodnutím Rady (SZBP) 2024/1770, a to s ohledem na skutečnost, že původní zápis obsahuje takové omezující opatření, které vůči subjektu není v důsledku jeho zařazení na sankční seznam Evropské unie uplatňováno.'
        amendment_dates: ["2024-05-27", "2024-06-26"]
      # An amendment without a date. The date of the amendment is the date of
      # the entry which supersedes this one.
      - match: 'Zápis byl změněn z důvodu potřeby formální úpravy odkazů na ustanovení předpisu Evropské unie, jehož skutkovou podstatu subjekt jednáním naplnil a odkazu na ustanovení o uplatňovaných omezujících opatřeních, včetně relevantní úpravy odkazů na ustanovení v popisu postižitelného jednání.'
  type.country:
    lowercase: true
    normalize: true
    options:
      - match:
          - "Ruská federace"
          - "Ruská federace"
          - dnes pravděpodobně Ruská federace
        value: RU
      - match:
          - "dříve Ukrajina"
          - "Ukrajina"
        value: UA
      - match:
          - "Stát Izrael"
        value: Israel
      - match: "Česká republika"
        value: Czech Republic
      - match: Libanonská republika
        value: Lebanon
  name_notes:
    normalize: true
    options:
      - match: Federální státní unitární podnik Podnik pro správu majetku vzahraničí Kanceláře prezidenta Ruské federace (Goszagransobstvennost)
        names:
          - Federální státní unitární podnik „Podnik pro správu majetku v zahraničí“ Kanceláře prezidenta Ruské federace (Goszagransobstvennost)
      - match: Voice of Europe s.r.o.
        names:
          - Voice of Europe s.r.o.
      - match: Al-Qard Al-Hassan Association/AQAH/القرض الحسن
        names:
          - Al-Qard Al-Hassan Association
          - AQAH
          - القرض الحسن
