  frequency: monthly
  start: 2026-10-05
load_statements: true
ci_test: false
summary: >-
  Lower chamber of Parliament, 125 members elected by proportional vote
description: |
  Current and historical members of the National Assembly, the lower chamber of
  the bicameral Parliament of Cambodia. Its 125 members are directly elected
  from the provinces under proportional representation for a five-year term
  and hold the country's legislative power, including passing laws and approving
  the budget.
url: https://nac.org.kh/
publisher:
  name: រដ្ឋសភា
  name_en: National Assembly of the Kingdom of Cambodia
  description: >
    The National Assembly is the lower chamber of the Parliament of Cambodia, alongside
    the Senate. Its members are elected from the country's provinces and the capital,
    Phnom Penh.
  url: https://nac.org.kh/
  country: kh
  official: true
data:
  url: https://nac.org.kh/
  format: HTML
  lang: khm

