summary: >-
  Lower chamber of Parliament, 125 members elected by proportional vote
description: |
  Current and historical members of the National Assembly, the lower chamber of the
  Parliament of Cambodia. Its 125 members are directly elected from the provinces under
  proportional representation for a five-year term and hold the country's legislative
  power, including passing laws and approving the budget.
