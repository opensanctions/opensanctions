config:
  # The roster table's column headings, in order: number, name, constituency, party. The
  # crawler reads the cells by position and checks the headings against this list, so a
  # renamed or reordered column fails the crawl instead of mixing up properties.
  roster_columns:
    - ល.រ
    - នាម និង គោត្តនាម
    - មណ្ឌល
    - គណបក្សនយោបាយ
  # Legislatures whose members cannot be read off the site. The 1st, 2nd and 4th publish
  # their rosters only as scanned images (e.g. https://nac.org.kh/Images/NA4_name1.jpg),
  # and https://nac.org.kh/group-article/49 publishes no member names at all for the 3rd,
  # only the list of its constituencies. This is a closed set: every other legislature in
  # the switcher must publish a roster table, or the crawl fails.
  legislatures_without_roster:
    - 1
    - 2
    - 3
    - 4

assertions:
  min:
    schema_entities:
      Person: 218
      Position: 1
