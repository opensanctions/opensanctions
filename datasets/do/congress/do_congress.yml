title: Dominican Republic Members of the National Congress
entry_point: crawler.py
prefix: do-cgso
coverage:
  frequency: monthly
  start: 2026-09-29
load_statements: true
ci_test: true
summary: >-
  Deputies and senators of the bicameral National Congress of the Dominican Republic
description: |
  This dataset lists the members of the National Congress (Congreso Nacional), the
  bicameral legislature of the Dominican Republic.

  The Chamber of Deputies (Cámara de Diputados) has 190 members, elected by proportional
  representation from provincial, national and overseas constituencies. The Senate
  (Senado) has 32 members, one for each province and one for the National District.
  Members of both chambers serve four-year terms. Together, the two chambers pass the
  country's laws and approve its budget.
url: https://camaradediputados.gob.do/
publisher:
  name: Cámara de Diputados de la República Dominicana
  name_en: Chamber of Deputies of the Dominican Republic
  acronym: CD
  description: >
    The Chamber of Deputies is the lower chamber of the bicameral National Congress
    of the Dominican Republic. It operates the Sistema de Información Legislativa
    (SIL), which tracks the Chamber's bills, sessions and votes, and whose legislator
    directory also lists the members of the Senate.
  url: https://camaradediputados.gob.do/
  country: do
  official: true
data:
  # Keep the trailing slash: the crawler urljoin()s endpoint names onto it.
  url: https://www.diputadosrd.gob.do/sil/api/legislador/
  format: JSON
  lang: spa

tags:
  - list.pep

lookups:
  # The API's "funcion" field also lists institutions (electoral authority, executive,
  # supreme court) cross-referenced by the legislative system, alongside the two
  # chamber roles it exists to enumerate. Every value must route here explicitly.
  role:
    required: true
    options:
      - match:
          - Diputado
          - Diputada
        value: deputy
      - match:
          - Senador
          - Senadora
        value: senator
      - match: Institución del Estado
        value: null
  district:
    options:
      - match: No aplica
        value: null

assertions:
  min:
    schema_entities:
      Person: 210
      Position: 2
    country_entities:
      do: 190
  max:
    schema_entities:
      Person: 260
      Position: 2
