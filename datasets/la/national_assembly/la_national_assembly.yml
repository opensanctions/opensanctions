title: Laos Members of the National Assembly
name: la_national_assembly
prefix: la-na
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: true
summary: >-
  Unicameral legislature, deputies elected from provincial constituencies
description: |
  Current members of the National Assembly (Sapha Heng Saht), the unicameral legislature
  of the Lao People's Democratic Republic. Its deputies are elected from provincial
  constituencies for a five-year term and hold the country's legislative power, including
  passing laws and approving the budget.
url: https://na.gov.la/members/?lang=en
publisher:
  name: National Assembly of the Lao PDR
  description: >
    The National Assembly is the unicameral legislature of the Lao People's Democratic
    Republic, whose deputies are elected from provincial constituencies.
  url: https://na.gov.la/
  country: la
  official: true
data:
  url: https://na.gov.la/members/?lang=en
  format: HTML
  lang: lao

tags:
  - list.pep

names:
  prefixes_strip:
    - ທ່ານ # Mr
    - ນາງ # Mrs / Ms
    - ສຈ. # Professor
    - ຮສ. # Associate Professor
    - ດຣ. # Dr
    - ປອ. # Doctor
    - ປອ
    - ພັທ. # military/police ranks
    - ພັອ.
    - ພັນ
    - ພົຈວ.
    - ພົຕ.
    - ພົທ.
    - Mr.
    - Mr
    - Mrs.
    - Mrs
    - Ms.
    - Ms
    - Dr.
    - Prof.
    - Assoc.
    - Maj.
    - Gen.
    - Pol.
    - Lt.
    - Col.
    - Col
    - H.E.
  suffixes_strip:
    - PHD
    - ", PH.D"
    - MD.PHD
    - MD.MPHM
  schema_rules:
    Person:
      # A full stop remaining after prefix stripping indicates a rank abbreviation
      # missing from prefixes_strip; the crawler warns on such names unless they
      # are cleared in the name_with_stop_ok lookup.
      reject_chars: "."

lookups:
  name_with_stop_ok:
    options:
      # Full stop is a surname initial, not an unstripped title.
      - match:
          - ສີສູນທອນ ສ.ຜາບມີໄຊຍ໌
          - Sisouthone S.PHABMIXAY

assertions:
  min:
    schema_entities:
      Person: 120
      Position: 1
    country_entities:
      la: 120
  max:
    schema_entities:
      Person: 200
      Position: 1
