description: |
  Current members of the National Assembly (Asamblea Nacional) of the Bolivarian
  Republic of Venezuela, the country's unicameral national legislature. Its members
  are elected for a five-year term under a parallel system that combines closed-list
  proportional representation with constituency seats, alongside seats reserved for
  Indigenous peoples, and hold the country's legislative power, including passing
  laws and approving the budget.
