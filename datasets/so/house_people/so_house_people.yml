title: Somalia Members of the House of the People
name: so_house_people
prefix: so-hop
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-10-19
load_statements: true
summary: >-
  Lower chamber of Somalia's bicameral Parliament, the House of the People (Golaha Shacabka)
description: |
  Current members of the House of the People (Golaha Shacabka), the lower chamber of
  Somalia's bicameral Federal Parliament. Its 275 seats are shared out between clans
  under the 4.5 power-sharing formula and filled for four-year terms by electoral
  colleges of delegates nominated in the federal member states. Together with the
  Upper House its members hold the country's legislative power, including passing
  laws, approving the budget and electing the President. Former members are included
  where the source still names them on a seat it marks as vacant.
url: https://parliament.gov.so/
publisher:
  name: Baarlamaanka Federaalka Soomaaliya
  name_en: Federal Parliament of Somalia
  description: >
    The Federal Parliament of Somalia is the country's bicameral national legislature.
    Its lower chamber, the House of the People, publishes the roster of its sitting
    members.
  url: https://parliament.gov.so/
  country: so
  official: true
data:
  url: https://parliament.gov.so/members/
  format: JSON

dates:
  formats: ["%A, %B %d, %Y", "%A %B %d, %Y"]

names:
  prefixes_strip:
    - Hon.
    - Xil.
    - Dr.

tags:
  - list.pep

