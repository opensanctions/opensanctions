title: Jordan Members of the Senate
prefix: jo-sen
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-11-09
load_statements: true
ci_test: false
summary: >-
  Members of the Senate of Jordan, the upper chamber of the Parliament, whose
  members are appointed by the King
description: |
  Current and recent members of the Senate of Jordan (مجلس الأعيان), the upper
  chamber of the bicameral Parliament of Jordan. Its members are appointed by the
  King for a four-year term, number no more than half the House of
  Representatives, and share the country's legislative power with the elected
  House, including passing laws and approving the budget.

  The dataset covers the members appointed at the start of the current Senate,
  including those who have since left it.
url: https://senate.jo/Ar/List/اعضاء_المجلس_الحالي_والسير_الذاتية
publisher:
  name: مجلس الأعيان الأردني
  name_en: Senate of Jordan
  description: >
    The Senate is the upper chamber of the Parliament of Jordan, whose members are
    appointed by the King.
  url: https://senate.jo/
  country: jo
  official: true
data:
  url: https://senate.jo/Ar/List/اعضاء_المجلس_الحالي_والسير_الذاتية
  format: HTML
  lang: ara
dates:
  formats: ["%d/%m/%Y", "%d %m %Y"]
  # Levantine Arabic month names, as in "22 نيسان 1952".
  months:
    "01": كانون الثاني
    "02": شباط
    "03": آذار
    "04": نيسان
    "05": أيار
    "06": حزيران
    "07": تموز
    "08": آب
    "09": أيلول
    "10": تشرين الأول
    "11": تشرين الثاني
    "12": كانون الأول

tags:
  - list.pep

lookups:
  # Leading honorifics of member names; the title after the rank gives gender.
  honorifics:
    options:
      - match: ["سعادة", "معالي", "دولة"]
        gender: null
      - match: ["السيد", "الدكتور", "المهندس", "المحامي", "الأستاذ"]
        gender: male
      - match: ["السيدة", "الدكتورة", "المهندسة", "المحامية", "الأستاذة"]
        gender: female

assertions:
  min:
    schema_entities:
      Person: 60
      Position: 1
    country_entities:
      jo: 60
  max:
    schema_entities:
      Person: 90
      Position: 2
