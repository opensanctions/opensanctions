title: Estonia Members of the Riigikogu
entry_point: crawler.py
prefix: ee-rii
coverage:
  frequency: monthly
  start: "2024-02-08"
load_statements: true
summary: >-
  Current and historical members of the Riigikogu, Estonia's unicameral parliament
description: |
  Current and historical members of the Riigikogu, Estonia's unicameral
  national legislature. Its 101 members are elected by proportional
  representation, with regular elections held every four years. The
  Riigikogu passes laws, approves the state budget, authorises a candidate
  for Prime Minister to form a government, and elects the President of
  the Republic unless the election passes to an electoral college.
tags:
  - list.pep
publisher:
  name: Riigikogu
  name_en: Parliament of Estonia
  description: Estonia Parliament
  url: https://www.riigikogu.ee/en/
  official: true
  country: "ee"
url: "https://www.riigikogu.ee/en/parliament-of-estonia/members-of-the-riigikogu/"
data:
  url: https://api.riigikogu.ee/api/plenary-members
  format: JSON
  lang: est

lookups:
  # Source job titles mapped to the official English titles used by the
  # Riigikogu because automated translation gives inconsistent results between these positions.
  # See "Board of the Riigikogu" on
  # https://www.riigikogu.ee/en/introduction-and-history/introduction/structure-of-riigikogu/
  position_eng:
    required: true
    options:
      - match: Riigikogu liige
        value: Member of the Riigikogu
      - match:
          - Riigikogu esimees
          - esimees
        value: President of the Riigikogu
      - match: Riigikogu I aseesimees
        value: First Vice-President of the Riigikogu
      - match: Riigikogu II aseesimees
        value: Second Vice-President of the Riigikogu
      # The 12th composition (2011-2015) labels its presidium with the bare words
      # for chair and deputy chair, without saying which of the two Vice-Presidents.
      - match: aseesimees
        value: Vice-President of the Riigikogu

assertions:
  min:
