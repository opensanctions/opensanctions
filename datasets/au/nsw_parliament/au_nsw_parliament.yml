summary: >-
  Current members of the Legislative Assembly and the Legislative Council
description: |
  Current members of the Parliament of New South Wales, the bicameral legislature
  of the Australian state of New South Wales. The Legislative Assembly (lower
  house) has 93 members. Each member represents a single-member electorate,
  elected by optional preferential voting for a fixed four-year term. The
  Legislative Council (upper house) has 42 members, elected statewide by
  proportional representation for eight-year terms. Half of its seats are filled
  at each state election. Together, the two houses hold the state's legislative
  power, including passing laws, approving the budget and scrutinising the
  government.
