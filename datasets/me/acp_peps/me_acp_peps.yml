title: Montenegro Income and Asset Declarations by Public Officials
entry_point: crawler.py
prefix: me-gov
coverage:
  frequency: weekly
  start: "2024-01-31"
load_statements: true
ci_test: false # because it takes hours to run
summary: >
  Current and former office holders reporting to the anti-corruption agency
description: |
  Montenegrin public officials are required by law to report their income, assets
  and public functions to the Agency for Prevention of Corruption, which publishes
  the reports in a public register. This dataset lists current and former officials,
  based on the functions in their reports.

  For officials who served at the national level, it also includes the family
  members listed in their reports.
publisher:
  name: Agencija za sprečavanje korupcije
  name_en: Agency for Prevention of Corruption
  acronym: ACK
  description: |
    Montenegro's Agency for Prevention of Corruption, tasked with preventing conflicts
    of interest, monitoring integrity, and ensuring transparency in governance.
  url: https://www.antikorupcija.me/en/
  country: "me"
  official: true
tags:
  - list.pep
  - list.pep.bulk
url: https://obsidian.antikorupcija.me/registri/pretraga-izvjestaja-o-prihodima-i-imovini
data:
  url: https://obsidian.antikorupcija.me/api/ask-interni-pretraga/ank-izvjestaj-imovine/pretraga-izvjestaj-imovine-javni
  format: JSON
  lang: cnr # Montenegrin (ISO 639-2)
dates:
  formats: ["%d.%m.%Y", "%d.%m.%Y."]

assertions:
  min:
    schema_entities:
      Person: 9370
      Position: 3400
  max:
    schema_entities:
      Person: 22000
      Position: 8080

lookups:
  type.country:
    lowercase: true
    options:
      - match: Crnogorsko
        value: me
      - match:
          - SRPSKO
          - Srbijansko
          - Republike Srbije
          - R.Srbije
        value: rs
      - match: Crnogorsko i srpsko
        values: [me, rs]
      - match: Britansko
        value: gb
      - match: Tursko
        value: tr
      - match:
          - američko
          - Americko
        value: us
      - match: Makedonsko
        value: mk
      - match: Hrvatsko
        value: hr
      - match: Austrijsko
        value: at
  type.address:
    lowercase: true
    options:
      # Map short address strings to bypass short address warnings
      - match: Bar
        value: Bar
      - match: Bor
        value: Bor
      - match: Šas
        value: Šas
  type.string:
    options:
      - match: "%"
        value: null
  type.date:
    options:
      - match: "."
        value: null
