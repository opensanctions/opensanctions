      - match:
          - Taiwan, Province of China
          # "Taipei 110 Taiwan (Province of China)", after the ISO 3166 name
          - Province of China
        value: tw
  type.address:
    # Placeholders for an address or registered office the filer did not give.
    lowercase: true
    options:
      - match:
          - Nil
          - N/A
          - NA
          - HK
          # "not applicable", simplified and traditional
          - 不适用
          - 不適用
          - 无
          - 無
        value: null
