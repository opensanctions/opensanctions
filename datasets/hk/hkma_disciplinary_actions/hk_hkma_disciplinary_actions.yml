# The index page lists one entry per press release, with the institutions named in that
# action separated by <br /> inside the link's title attribute. Institution names carry a
# trailing parenthetical abbreviation used in the press release body ("... (IOBHK)").
# Splitting the listing into institutions, and separating each name from its aliases and
# abbreviation, goes through the data review framework: nothing is emitted for a press
# release until a reviewer has accepted its extraction in the Review UI. A new action
# therefore shows up as an unaccepted-review warning and a shortfall against the minimum
# assertions.
#
# Entries older than the standard enforcement support period are skipped, so the entity
# count shrinks as old actions age out. The source has published only a handful of actions
# per year since 2015.
title: Hong Kong HKMA Disciplinary Actions
entry_point: crawler.py
ci_test: false  # GPT key not available in CI, and entity splits need review
prefix: hk-hkma
coverage:
  frequency: daily
  start: 2026-08-31
load_statements: true
summary: >-
  Banks and stored value facility licensees disciplined by Hong Kong's banking regulator
  for anti-money laundering control failures
description: |
  The Hong Kong Monetary Authority (HKMA) is the territory's central banking institution
  and the supervisor of authorized institutions and stored value facility licensees. It
  may take disciplinary action against them under section 21 of the Anti-Money Laundering
  and Counter-Terrorist Financing Ordinance (Cap. 615) and under the Payment Systems and
  Stored Value Facilities Ordinance (Cap. 584), imposing pecuniary penalties, public
  reprimands and remedial orders where an institution's systems of control fail to meet
  the statutory anti-money laundering and counter-financing of terrorism requirements.

  Each action is announced in a press release which may name several institutions at
  once. The dataset covers the institutions named in those announcements; it does not
  cover HKMA enforcement under other parts of the banking regime, nor actions against
  individual bank staff. Following OpenSanctions policy on enforcement data, actions
  older than five years are excluded.
url: https://www.hkma.gov.hk/eng/key-functions/banking/anti-money-laundering-and-counter-financing-of-terrorism/disciplinary-actions/
publisher:
  name: Hong Kong Monetary Authority
  acronym: HKMA
  description: >
    The HKMA is the central banking institution of the Hong Kong Special Administrative
    Region. It maintains currency and banking stability, supervises authorized
    institutions under the Banking Ordinance, and is the relevant authority for
    anti-money laundering supervision of banks and stored value facility licensees.
  url: https://www.hkma.gov.hk/eng/
  country: hk
  official: true

data:
  url: https://www.hkma.gov.hk/eng/key-functions/banking/anti-money-laundering-and-counter-financing-of-terrorism/disciplinary-actions/
  format: HTML
  lang: eng

dates:
  formats: ["%d %b %Y"]

tags:
  - list.enforcement
  - sector.banking
  - sector.financial

assertions:
  # Only "Thing" schemata are counted, so Sanction and Documentation cannot be asserted.
  min:
    schema_entities:
      Company: 10
      Article: 8
  max:
    schema_entities:
      Company: 45
      Article: 35
