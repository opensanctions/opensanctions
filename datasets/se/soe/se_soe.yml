title: Sweden State-Owned Enterprises Leadership
prefix: se-soe
# Board rosters, employee representatives and auditors:
# https://www.regeringen.se/rapporter/2025/06/verksamhetsberattelse-for-bolag-med-statligt-agande-2024/
# Chairs and CEOs only:
# https://www.regeringen.se/rapporter/2026/07/arlig-information-om-bolag-med-statligt-agande-2025/
url: https://www.regeringen.se/regeringens-politik/bolag-med-statligt-agande/
coverage:
  frequency: never
  start: 2026-02-23
load_statements: true
manual_check:
  last_checked: "2026-02-16"
  interval: 182
  message: |
    Check whether a new report has been published, and extract it if so.
    extraction.md has the procedure, the traps in these PDFs, and the
    machine-readable alternatives already ruled out.
deploy:
  schedule: "@monthly"
entry_point: crawler.py
summary: >-
  Leadership positions in Swedish state-owned enterprises, including board chairs,
  board members, and CEOs.
description: |
  This dataset contains information about politically exposed persons (PEPs) in leadership
  roles at Swedish state-owned enterprises (SOEs). It includes chairs of the board, board
  members, and CEOs. These individuals hold significant positions in companies where
  the Swedish state is a major or controlling shareholder.

  Board members are taken from the government's activity report for the 2024 financial
  year, the last edition to publish full board rosters. Chairs and CEOs are also taken
  from the 2025 report, which covers the chairs elected at the 2026 annual general
  meetings. Positions are published without dates, so a person listed here may since
  have left the role.
tags:
  - list.pep
publisher:
  name: Regeringskansliet
  name_en: Government Offices of Sweden
  description: |
    Regeringskansliet (the Swedish Government Offices) is a government agency that supports the Swedish
    government in governing the country and implementing its policies. It acts as the central administrative
    body, comprising the Prime Minister's Office, ten ministries, and the Government Offices' Office for
    Administrative Affairs.
  country: "se"
  url: https://www.government.se/
  official: true
data:
  url: https://github.com/opensanctions/opensanctions/blob/main/datasets/se/soe/leadership.csv
  format: CSV
  lang: swe

assertions:
  min:
    schema_entities:
      Company: 35 # "Statens bolagsportfölj består av 38 bolag"
      Position: 105 # 35 * 3 (Chair, Board Member, CEO)
      Person: 250 # 281 Occupancies in 2024 but some people hold multiple positions
  max:
    schema_entities:
      Company: 42
      Position: 180
      Person: 380


lookups:
  # Former names of companies that were renamed while in the state's portfolio.
  previous_names:
    options:
      # "SSC Space AB (SSC) (tidigare Svenska rymdaktiebolaget)" (2025 report).
      - match: SSC Space AB
        value: Svenska rymdaktiebolaget
