title: China Sanctions Research
entry_point: crawler.py
prefix: cn-sanc
coverage:
  frequency: never
  start: 2024-03-08
manual_check:
  last_checked: "2026-09-01"
  interval: 45
  message: >
    Review official Chinese authorities not covered by automated MFA, MOFCOM, and
    Taiwan Affairs Office discovery — including Chinese embassies and other State
    Council departments — for new designation or list-change notices. See
    docs/discovery.md for the query set.
deploy:
  schedule: "30 6 * * *"
  issues_turns: 500
load_statements: true
summary: >
  Individuals and organisations targeted by the Anti-Foreign Sanctions Law,
  Counter-Measures List, Unreliable Entities List (UEL), Export Control List,
  and Export Control Watch List.
description: |
  China does not publish structured data on individuals and entities targeted by the
  country's sanctions legislation. This dataset is a partial list of individuals and
  organisations officially designated or listed by Chinese government authorities.

  Chinese sanctions are often framed as countermeasures against foreign sanctions
  and to reprimand public figures for criticizing China's policies, particularly
  regarding Hong Kong, Taiwan, and Xinjiang province.

  The dataset also covers entities subject to trade restrictions under the Unreliable
  Entities List (UEL), Export Control List, and Export Control Watch List.

  **Note**: This dataset is not comprehensive and should be used as a research
  tool but not as a definitive source of sanctions data on China.

  * [How China imposes sanctions](https://merics.org/en/report/how-china-imposes-sanctions) (MERICS)
  * [MFA Anti-Sanctions List and Measures](https://www.mfa.gov.cn/wjb_673085/zfxxgk_674865/gknrlb/fzcqdcs/)

  See the [designation extraction guide](https://github.com/opensanctions/opensanctions/blob/main/datasets/cn/sanctions/docs/extraction.md)
  for the conventions used to turn official notices into structured rows.
publisher:
  name: OpenSanctions
  description: |
    This dataset combines data published by various government departments,
    including the Ministry of Commerce, a state agency responsible for the
    regulation of economic activities such as trade, commodity inspection
    and industry; as well as the Ministry of Foreign Affairs, which is
    responsible for China's foreign relations and international diplomacy;
    and the Taiwan Affairs Office of the State Council, which is responsible
    for policy relating to Taiwan.
  url: https://www.opensanctions.org/
  official: false
  country: cn
url: https://github.com/opensanctions/opensanctions/blob/main/datasets/cn/sanctions/sanctions.csv
data:
  url: https://raw.githubusercontent.com/opensanctions/opensanctions/refs/heads/main/datasets/cn/sanctions/sanctions.csv
  format: CSV
dates:
  formats: ["%d.%m.%y", "%d.%m.%Y"]
tags:
  - list.sanction.counter
  - list.export
  - target.us

assertions:
  min:
    schema_entities:
      Person: 90
      Company: 45
      Organization: 20

lookups:
  sanction.program:
    options:
      - match: UEL
        value: CN-UEL
      - match:
          - Decision on Countermeasures against U.S. military-industry enterprises and senior managers
          - Decision on Countermeasures against U.S. Military-industry Enterprises
          - Decision on countermeasures against U.S. Congressman McGowern
          - List of Targets of Countermeasures
          - AFSL
        value: CN-CML
      - match: List of Export Controls
        value: CN-ECL
      - match: Export Control Watch List
        value: CN-ECWL
      - match: Diehard "Taiwan Independence" Separatists
        value: CN-TAO-DIEHARD
      - match: Henchmen and Accomplices of "Taiwan Independence"
        value: CN-TAO-ACCOMP
      - match: ""
        value: null
  # Latest-status phrases copied verbatim from MOFCOM notices. `ends` decides whether
  # the notice closes the designation (endDate) or suspends it (modifiedAt).
  current_status:
    options:
      - match:
          - 停止上述相关措施
          - 停止执行相关措施
          - 停止3月4日公告（不可靠实体清单工作机制公告〔2025〕5号和6号）相关措施
          - 停止4月9日公告（不可靠实体清单工作机制〔2025〕8号）相关措施
          - 移出反制清单
        ends: true
      - match:
          - 继续暂停上述相关措施1年
          - 继续暂停4月4日公告（不可靠实体清单工作机制公告〔2025〕7号）相关措施1年
          - 暂停商务部令二〇二五年第6号（《关于对韩华海洋株式会社5家美国相关子公司采取反制措施的决定》）相关措施一年
        ends: false

config:
  discovery:
    # Handling "Unreviewed designation notice" warnings:
    #
    # 1. Fetch the warning's exact URL. Current MFA and MOFCOM notices are HTML; `curl -LfsS "$URL"` is normally sufficient. Inspect linked annexes when the designation names are not present in the main article.
    # 2. Confirm that the page is an official designation/list-change notice. Do not use press coverage as the source.
    # 3. For an addition, append one sanctions.csv row per named person or legal entity. Multiple listings of the same entity are intentional: each designation event should remain a separate row.
    # 4. Use the exact candidate URL in `Source URL`. Once every designation in the notice is represented, this automatically mutes the warning.
    # 5. If the page is an alternate official URL for represented data, or is irrelevant, append its exact URL to `reviewed_urls` instead. Never mute a notice before checking all names and annexes.
    #
    # sanctions.csv conventions (see docs/extraction.md for the full guide):
    # - Type: Person, Company, or Organization.
    # - Name: official Latin-script name where published.
    # - Alias: additional Latin-script names separated by semicolons.
    # - Chinese name: source spelling, when present.
    # - Country: ISO 3166-1 alpha-2 code when identifiable.
    # - Date/End date: DD.MM.YYYY; use the effective date stated in the decision, which may differ from the publication date in the URL.
    # - Source URL: official notice URL(s), semicolon-separated when a second page is needed to support the name.
    # - Summary/Chinese summary: role or identity note for the target as published in the notice; emitted as `notes`.
    # - Notice ID: instrument key matching the discovery logical key (MOFCOM-2025-13, MOFCOM-UEL-2025-7); 商务部令 orders use MOFCOM-ORDER-<year>-<n>.
    # - Notice title/Current status notice title: verbatim titles, CSV-only.
    # - Designation quote/Current status quote: full sentences copied exactly from the cited page, with language codes.
    # - Current status (source): verbatim phrase from the latest status notice; it must be a substring of the quote and be listed in the `current_status` lookup.
    # - Current status date: effective date of that notice; becomes endDate for ending phrases and modifiedAt for suspensions. End date must match it when both are set.
    # - Address: preserve the official address as one value.
    # - QID: optional; add only when the identity is certain.
    # - Body: Ministry of Foreign Affairs or Ministry of Commerce.
    # - List of Export Controls -> Topics `export.control`, List `List of Export Controls`.
    # - Export Control Watch List -> Topics `export.control`, List `Export Control Watch List`.
    # - Unreliable Entity List -> Topics `sanction.counter`, List `UEL`.
    # - MFA countermeasures -> Topics `sanction.counter`; retain the program/list wording already used by comparable CSV rows.
    #
    # Preserve existing rows when an official source URL disappears. A formal delisting or suspension is a status-change task and must not be treated as evidence that the original designation never occurred.
    reviewed_urls:
      - https://www.mfa.gov.cn/web/wjb_673085/zfxxgk_674865/gknrlb/fzcqdcs/202212/t20221222_10993979.shtml
