title: UK FCA Warning List of Unauthorised Firms
prefix: gb-fca-ntc
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-06-16
load_statements: true
ci_test: false
summary: >-
  Firms and individuals identified by the UK FCA as operating without authorisation.
description: |
  The Financial Conduct Authority (FCA) publishes a warning list of firms and
  individuals that are not authorised or registered by the FCA, or which appear
  to be impersonating legitimate authorised firms (clone firms). Consumers are
  warned not to deal with these entities.

  The list is continuously updated and includes entities operating in the UK
  financial services sector without the required FCA authorisation.
url: https://www.fca.org.uk/consumers/warning-list-unauthorised-firms
publisher:
  name: Financial Conduct Authority
  acronym: FCA
  description: |
    The FCA is the conduct regulator for financial services firms and financial
    markets in the UK. It publishes a number of databases and registers, including
    the Warning List of firms and individuals that aren’t allowed to operate in the UK.
  url: https://www.fca.org.uk/
  country: gb
  official: true
tags:
  - list.regulatory
  - publisher.west
  - sector.financial
data:
  url: https://www.fca.org.uk/consumers/warning-list-unauthorised-firms
  format: HTML
  lang: eng

dates:
  formats: ["%d/%m/%Y", "%Y-%m-%d"]
names:
  suffixes_strip:
    # Status markers the warning list appends to every name, e.g. "Acme (new)".
    - "(new)"
    - "(updated)"
    # Common clone annotations (kept as the corp.clone topic); others go to review.
    - "(Clone of FCA authorised firm)"
    - "(Clone of EEA authorised firm)"
    - "(Clone)"
    - "(Clone of FCA authorised firms)"
    - "(Clone of authorised firm)"
    - "(Clone of an FCA authorised firm)"
    - "(Clone of FCA registered firm)"
    - "(Clone of an EEA authorised firm)"
    - "(Clone firm)"
    - "(Clone of appointed representative firm)"
    - "(Clone of FCA authorised appointed representative)"
    - "(Clone of UK registered company)"
    - "(Clone of a UK registered company)"
    - "(Clone of former PSD agent)"
    - "(Clone of appointed representative)"
    - "(Clone of FCA firm)"
    - "(Clone of FCA recognised fund)"
    - "(Clone of previously FCA authorised firm)"
  schema_rules:
    LegalEntity:
      reject_chars: "/();"
      reject_strings:
        # Clone annotations not in suffixes_strip.
        - "clone"
        # Padded to spare names like "Nagashima Sakai".
        - " aka "
        - "previously"
        - "now known as"
        - "formerly"
        # Cloudflare's placeholder for an obfuscated email.
        - "[email protected]"

lookups:
  firm_details:
    lowercase: true
    options:
      - match: name
        value: name
      - match: [website, url, web address]
        value: website
      - match: [telephone, tel, mobile, phone, fax]
        value: phone
      - match: [email, e-mail]
        value: email
      - match: address
        value: address
      # Social media fields mix handles ("@foo"), labels and links; keep them as published.
      - match: [other information, apps, social media, social media details]
        value: notes
  type.email:
    lowercase: true
    options:
      - match: '[email protected]'
        value: null
      # Local part exceeds the 64-character limit, so not a deliverable address.
      - match: nicholas.cooper_at_lyxorassetmanagement_com_b9v5x3caceb2kf_d2yy7553@icloud.com
        value: null
  type.address:
    options:
      - match: ['na/', 'n.a', 'UK']
        value: null
