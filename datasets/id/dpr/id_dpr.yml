title: Indonesia Members of the People's Representative Council
name: id_dpr
prefix: id-dpr
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: false  # Signed GraphQL requests require Zyte API
summary: >-
  Lower chamber of the Indonesian parliament, elected from 84 electoral districts
description: |
  Current and former members of the People's Representative Council (Dewan Perwakilan
  Rakyat, DPR), the lower chamber of Indonesia's bicameral parliament, since 1999. Its
  current 580 members are elected from 84 electoral districts (dapil) across the provinces
  for a five-year term and hold the country's legislative power, including passing laws
  and approving the budget.
url: https://www.dpr.go.id/en/tentang-dpr/informasi-anggota-dewan
publisher:
  name: Dewan Perwakilan Rakyat Republik Indonesia
  acronym: DPR
  description: >
    The People's Representative Council is the lower chamber of the Indonesian parliament,
    composed of members elected from electoral districts across the country.
  url: https://www.dpr.go.id/
  country: id
  official: true
data:
  # GraphQL endpoint used by the client-rendered member listing
  url: https://www.dpr.go.id/gql
  format: JSON
  lang: ind

tags:
  - list.pep

names:
  # The closed set of honorifics stripped deterministically. Academic degrees and
  # other per-record noise are left to the name review system (see schema_rules).
  prefixes_strip:
    - Dr.
    - H.
    - Hj.
    - KH.
    - Prof.
    - Ir.
  schema_rules:
    Person:
      # Many members are known by a single name, a common Indonesian practice.
      require_space: false
      # Post-nominal degrees are appended after a comma ("..., S.H., M.H.").
      reject_chars: ","
      reject_strings:
        - "Drs."
        - "Dra."
        - "drg."
        - "drh."
        - "S.E."
        - "S.H."
        - "S.Sos"
        - "S.T."
        - "S.IP"
        - "S.Pd"
        - "S.Ag"
        - "M.M."
        - "M.Si"
        - "M.H."
        - "M.Kn"
        - "M.Hum"
        - "M.Pd"
        - "MBA"
        - "Ph.D"
        - "PhD"

lookups:
  # statusOff records whether, and why, a member left their seat.
  occupancy_status:
    options:
      - match: Dalam masa jabatan
        value: current
      - match:
          - Selesai masa jabatan # term finished
          - Diberhentikan # dismissed
          - Mengundurkan diri # resigned
          - Meninggal dunia # died
          - Menduduki Jabatan Lain # took up another office
          - Lain-lain # other
        value: ended
      # Suspended: it is unclear whether the member still holds the seat.
      - match: NonAktif
        value: unknown

assertions:
  min:
    schema_entities:
      Person: 2000
      Position: 1
    country_entities:
      id: 2000
  max:
    schema_entities:
      Person: 2200
      Position: 1
