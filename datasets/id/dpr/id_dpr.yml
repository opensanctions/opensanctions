title: Indonesia Members of the People's Representative Council (DPR)
name: id_dpr
prefix: id-dpr
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: false  # Browser-rendered Zyte fetch of a client-rendered listing
summary: >-
  Lower chamber of the Indonesian parliament, elected from 84 electoral districts
description: |
  Current members of the People's Representative Council (Dewan Perwakilan Rakyat, DPR),
  the lower chamber of Indonesia's bicameral parliament. Its 580 members are elected from
  84 electoral districts (dapil) across the provinces for a five-year term and hold the
  country's legislative power, including passing laws and approving the budget.
url: https://www.dpr.go.id/en/tentang-dpr/informasi-anggota-dewan
publisher:
  name: Dewan Perwakilan Rakyat Republik Indonesia
  acronym: DPR
  description: >
    The People's Representative Council is the lower chamber of the Indonesian parliament,
    composed of members elected from electoral districts across the country.
  url: https://www.dpr.go.id/
  country: id
  official: true
data:
  # Client-rendered Next.js listing. The crawler renders it in a browser and
  # reads the roster from the JSON the page fetches for itself.
  url: https://www.dpr.go.id/en/tentang-dpr/informasi-anggota-dewan
  format: JSON
  lang: ind

