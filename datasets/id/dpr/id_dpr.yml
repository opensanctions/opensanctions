description: |
  Current members of the People's Representative Council (Dewan Perwakilan Rakyat, DPR),
  the lower chamber of Indonesia's bicameral parliament. Its 580 members are elected from
  84 electoral districts (dapil) across the provinces for a five-year term and hold the
  country's legislative power, including passing laws and approving the budget.
