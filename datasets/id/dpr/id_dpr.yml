title: Indonesia Members of the People's Representative Council
name: id_dpr
prefix: id-dpr
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: false  # Signed GraphQL requests require Zyte API
summary: >-
  Lower chamber of the Indonesian parliament, elected from 84 electoral districts
description: |
  Current and former members of the People's Representative Council (Dewan Perwakilan
  Rakyat, DPR), the lower chamber of Indonesia's bicameral parliament, since 1999. Its
  current 580 members are elected from 84 electoral districts (dapil) across the provinces
  for a five-year term and hold the country's legislative power, including passing laws
  and approving the budget.
url: https://www.dpr.go.id/en/tentang-dpr/informasi-anggota-dewan
publisher:
  name: Dewan Perwakilan Rakyat Republik Indonesia
  acronym: DPR
  description: >
    The People's Representative Council is the lower chamber of the Indonesian parliament,
    composed of members elected from electoral districts across the country.
  url: https://www.dpr.go.id/
  country: id
  official: true
data:
  # GraphQL endpoint used by the client-rendered member listing
  url: https://www.dpr.go.id/gql
  format: JSON
  lang: ind

tags:
  - list.pep

