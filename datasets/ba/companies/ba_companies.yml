title: Bosnia and Herzegovina Business Registers (FBiH and Brčko)
prefix: ba-reg
disabled: false
entry_point: crawler
coverage:
  frequency: monthly
  start: 2023-03-21
exports:
  - statistics.json
  - entities.ftm.json
  - entities.delta.json
deploy:
  premium: true
resolve: false
ci_test: false
summary: |
  Business entities registered in the Federation of BiH and Brčko District.
description: |
  The database of available electronic court registers of business entities:
  Register of Business Entities in the District Brčko of BiH and Register of Business
  Entities in the Federation of BiH. Republika Srpska keeps a separate register,
  which is not included.

  The electronic court registers contain information on all business/legal entities
  that are required to register by the Laws on Registration of Business Entities
  (a business company or an enterprise established for the purpose of economic activity,
  a cooperative or a cooperative association or any other legal entity performing an
  economic activity established in accordance with the specific laws of the Federation
  of BiH and District Brčko with the aim of generating profit); since the moment those electronic
  registers were introduced in the registration courts.

  Available information from electronic registers is for informational purposes only and
  it cannot substitute a certified document – certificate from the register of business
  entities from a relevant registration court – which is issued upon request of an interested
  party as per a prescribed procedure.

  Company record has an information on the founders (persons and legal entities), managers as well
  as the information on company registration number, unique number, address and optional additional
  address, short and long name of the company, status and the date of the latest change.

  The shareholders of joint-stock companies (d.d.) are often not named in the register,
  which refers to the securities registries instead. Some companies appear without
  founders or managers because the register's own links to their details are broken.
  The register's search returns at most 500 entries per query, so a small number of
  companies without a registration date in the largest municipalities cannot be listed.

assertions:
  min:
    schema_entities:
      # Floors well below the 2026-10 counts (52k companies, 138k people, 7k
      # legal entities), to fail a run in which the registry session broke down
      # without the crawler noticing.
      Company: 50000
      Person: 125000
      LegalEntity: 6000

config:
  # Days for which a company's fetched pages are reused, so that a run restarted
  # after a failure skips what it already fetched. Keep this well below the
  # crawl interval, or a scheduled run reuses the previous run's data.
  record_cache_days: 7
  # Minutes to wait before each round of fetching the companies whose founders
  # page listed nobody again. The registry at times serves the founders report
  # without its records for an hour or more.
  recheck_delays_minutes: [15, 30, 60]
  # The run fails if more companies than this end up without founders; about
  # one in ten has none in the register.
  max_share_without_founders: 0.2

url: https://bizreg.pravosudje.ba
publisher:
  name: Federal Ministry of Justice and Judiciary Commission of District Brcko BiH
  country: ba
  url: https://bizreg.pravosudje.ba
  description: |
    Register of Business Entities in the District Brčko of BiH and Register of Business
    Entities in the Federation of BiH.
  official: true
data:
  url: https://bizreg.pravosudje.ba/pls/apex/f?p=186
  format: HTML
  lang: bos
http:
  total_retries: 5
  backoff_factor: 3
  retry_statuses: [503, 429, 403]
  retry_methods: [GET, POST]
  user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/42.0.2311.90 Safari/537.36 (zavod; opensanctions.org)

lookups:
  # The "Registration Number" field on the founders page sometimes describes where
  # a foreign founder is registered instead of naming the number, which blows past
  # the 64 character identifier limit. Pull the identifiers out of the prose.
  type.identifier:
    options:
      - contains: "mat.reg.broj 20566744, PIB 106266191"
        values:
          - "20566744"
          - "106266191"
      - contains: "uložak 234430, matični br. 035 96 338"
        values:
          - "C 234430"
          - "03596338"
      - contains: "080130530, OIB 13530191392"
        values:
          - "080130530"
          - "13530191392"
      - contains: "Reg.fondacija, Ministarstvo pravde, RF-3/02"
        value: "RF-3/02"
      - contains: "Odeljak B, uložak 21913"
        value: "B 21913"
      - contains: "PDV br. 02493150698, br. REA CH-183219"
        values:
          - "02493150698"
          - "CH-183219"
      - contains: "A17013863, Tr. reg. Girona"
        values:
          - "A17013863"
          - "GI-3095"
      # 19 characters, so not a valid (20 character) LEI - kept as a plain identifier.
      - contains: "L.E.I:815600D69B9617DA495"
        value: "815600D69B9617DA495"
      - contains: "02666995 Centralni registar"
        value: "02666995"
      - contains: "Broj registra: 0000776715"
        value: "0000776715"
      - contains: "382867177, Poreski broj: 9512480858"
        values:
          - "382867177"
          - "9512480858"
      - contains: "reg. br. 411001, broj u elektronskom registru"
        values:
          - "411001"
          - "09971382717000021"
      - contains: "pod brojem spisa HRB 11875 FL"
        value: "HRB 11875 FL"
      - contains: "pod brojem firme HR B 11896"
        value: "HRB 11896"
      # Associations, foundations and other non-commercial founders are cited by their
      # entry in a register kept by one of the justice ministries. The R-, RU- and RF-
      # numbers carry a year and identify the entry on their own.
      - contains: "Mostar br. R-1676/15"
        value: "R-1676/15"
      - contains: "HNK br. R-23/03, rješenje"
        value: "R-23/03"
      - contains: "R-278/01 novi R-21/03"
        values:
          - "R-278/01"
          - "R-21/03"
      - contains: "Registarski broj R-1171/11 knjiga"
        value: "R-1171/11"
      - contains: "registarskim brojem R-1580/14"
        value: "R-1580/14"
      - contains: "registarski broj RU-275/05"
        value: "RU-275/05"
      - contains: "RF-3/02, Knjiga II Registra fondacija"
        value: "RF-3/02"
      - contains: "RF-41/06 knjiga II"
        values:
          - "RF-41/06"
          - "4201115180002"
      - contains: "Registarski br:314/08"
        value: "314/08"
      - contains: "reg.br. 273/07 knjiga"
        value: "273/07"
      # The only numbers these give are the sequential entry number inside a numbered
      # register book, or the number of the decision that ordered the registration.
      # Neither identifies the entity on its own, so drop the prose rather than
      # emitting a fragment of it as a registration number.
      - match: "Broj 265"
        contains:
          - "u knjizi 1 registra Federalnog ministarstva pravde FBiH"
          - "Knjiga broj 1 registarski broj 699"
          - "humanitarne poslove pod rednim brojem 6."
          - "Kantona Sarajevo knjiga I, registarski broj 425"
          - "Rješenje Federalnog Ministarstva pravde Sarajevo 04-05-2-236/03"
          - "knjiga I pod registarskim brojm 652"
          - "knjiga IX Reg. broj 1623"
          - "Sarajevo reg. 695, Knjiga I"
          - "upisano pod registarskim brojem 315, knjiga I"
        value: null
  type.name:
    options:
      # Skip values that contain only dots, dashes, slashes, or spaces (e.g. "----", "...", "-//-", etc.)
      # Sometimes we get these values from the name or abbreviation fields.
      - regex: ^[.\-\/\s]+$
        value: null
      # The founder name field is occasionally used for a note listing the legal heirs
      # ("zakonski nasljednici") of a deceased founder and the share each of them holds.
      # The individual heirs cannot be split out reliably, so drop the note.
      - regex: ^ZAKONSKI NASLJEDNICI
        value: null
  type.address:
    options:
      # Placeholder values used where no address is recorded, seen in both the
      # additional address of a company and the address of a founding company.
      - regex: ^[.\-\/\s]+$
        value: null
  type.country:
    options:
      # North Macedonia, in the Bosnian long form used by the register.
      - match: "Republika Severna Makedonija"
        value: mk
