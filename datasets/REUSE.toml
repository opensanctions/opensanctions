# Data files under datasets/ are not covered by the repository's MIT license.
#
# CSVs default to CC BY-NC 4.0, because a CSV committed here is normally something a maintainer
# curated: transcribed from a source document, restructured, aligned to the FollowTheMoney schema,
# annotated with our own identifiers. The glob covers new ones automatically.
#
# Crawler code and dataset metadata (*.py, *.yml) are configuration that zavod executes, and fall
# through to MIT at the repository root.
#
# The glob is deliberately coarse. A few of the files it matches are snapshots a crawler writes
# back verbatim from its source rather than anything we produced, and we hold no rights in those.
# Sorting that out file by file was not sustainable, so the limit is stated once, in prose:
# the license reaches only as far as our own rights do. See COPYRIGHT.md.

version = 1

[[annotations]]
path = "**/*.csv"
SPDX-FileCopyrightText = "2026 OpenSanctions Datenbanken GmbH"
SPDX-License-Identifier = "CC-BY-NC-4.0"

# Bulk third-party artifacts — source PDFs, saved pages, extracted text. These are downloaded
# once and do not drift, so unlike the CSVs above they can be listed accurately.
[[annotations]]
path = [
  "bg/mft_national/dans_list.pdf",
  "lt/illegal_websites/data",
  "pk/proscribed_persons/source.json",
  "jp/meti_ru/*.txt",
  "sg/terrorists/*.html",
  "ru/egrul/docs/*",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-vendored-source"
