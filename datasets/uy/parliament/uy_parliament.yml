title: Uruguay Members of the General Assembly
entry_point: crawler.py
prefix: uy-parl
coverage:
  frequency: monthly
  start: 2026-11-06
load_statements: true
# parlamento.gub.uy is behind an AWS WAF challenge that only lets Uruguayan traffic
# through, so every request goes through the Zyte API with UY geolocation.
ci_test: false
summary: >-
  Current senators and representatives of Uruguay's bicameral national legislature
description: |
  Current members of the General Assembly (Asamblea General) of Uruguay, the country's
  bicameral national legislature. Its senators are elected nationwide and its
  representatives by department, all by proportional representation for a five-year
  term, and together they hold the country's legislative power, including passing laws
  and approving the budget.

  The dataset also includes the Vice President of the Republic, who presides over the
  General Assembly and the Chamber of Senators, and the President of the Chamber of
  Representatives. Former members are not included.
url: https://parlamento.gub.uy/camarasycomisiones/legisladores
tags:
  - list.pep
publisher:
  name: Parlamento del Uruguay
  name_en: Parliament of Uruguay
  description: |
    The Parliament of Uruguay is the national legislature of the country, formed by the
    Chamber of Senators and the Chamber of Representatives, which sit jointly as the
    General Assembly.
  country: uy
  url: https://parlamento.gub.uy/
  official: true
data:
  url: https://parlamento.gub.uy/camarasycomisiones/senadores/plenario/integracion/titulares/json?page&_format=json
  format: JSON
  lang: spa

assertions:
  min:
    schema_entities:
      Person: 120
      Position: 2
    country_entities:
      uy: 120
  max:
    schema_entities:
      Person: 160
      Position: 6

lookups:
  # The role line at the top of each member's profile. `member` says whether it
  # denotes membership of the chamber whose roster lists them; `name` adds a
  # presiding office held on top of (or, for the Vice President, instead of) it.
  role:
    options:
      - regex: "^Senadora? de la República por el Lema "
        member: true
      - regex: "^Representante Nacional por el Lema "
        member: true
      - regex: "^PRESIDENT[EA] DE LA CÁMARA DE REPRESENTANTES - Representante Nacional por el Lema "
        member: true
        name: President of the Chamber of Representatives of Uruguay
        wikidata_id: Q110192733
        topics: [gov.national, gov.legislative]
      # Constitution Art. 94: the Vice President presides over the Chamber of
      # Senators and the General Assembly with voice and vote, in addition to the
      # Chamber's 30 senators.
      - regex: "^PRESIDENT[EA] DE LA ASAMBLEA GENERAL Y DE LA CÁMARA DE SENADORES$"
        member: false
        name: Vice President of Uruguay
        wikidata_id: Q3773222
        topics: [gov.national, gov.executive]
