description: |
  Current members of the National Council of Monaco (Conseil National), the country's
  unicameral national legislature. Its members are elected in a single nationwide
  constituency under a mixed majority and proportional list system for a five-year
  term, and share the country's legislative power with the Prince, including passing
  laws and approving the budget.
