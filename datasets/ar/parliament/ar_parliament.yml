title: Argentina Members of Parliament
entry_point: crawler
prefix: ar-dep
coverage:
  frequency: monthly
  start: 2023-12-31
load_statements: true
ci_test: false  # No Zyte API in CI
summary: >-
  Current and recent members of the lower house of the National Congress.
description: |
  National Deputies (Members of the Parliament) - Representatives elected directly
  by the people of the provinces and the city of Buenos Aires of Argentina. The
  chamber of deputies is one of two houses of parliament in Argentina.
tags:
  - list.pep
publisher:
  name: Honorable Cámara de Diputados de la Nación Argentina
  acronym: HCDN
  official: true
  description: >
    The Honorable Chamber of Deputies of Argentina
  country: ar
  url: https://www.hcdn.gob.ar/index.html
url: https://datos.hcdn.gob.ar/dataset/legisladores
data:
  # The resource labels in the HCDN data portal are mixed up: the resource titled
  # "Composición Actual de la Cámara" (this one) holds the full history of deputies,
  # one row per bloc membership period, while the ones titled "Diputados" hold only
  # the 257 members currently in office. In July 2026 the CSV resources were
  # replaced with the reduced 1.9 current-composition export, so this JSON is the
  # only remaining source of the historical mandates.
  url: https://datos.hcdn.gob.ar/dataset/a80e0fa7-d73a-4ed1-9dec-80465e368951/resource/638cf72a-f993-4211-80e1-43984a529e4f/download/diputados_acuales1.8.json
  format: JSON
  lang: spa
dates:
  formats: ["%Y-%m-%dT%H:%M:%S"]

assertions:
  min:
    schema_entities:
      Person: 900
  max:
    schema_entities:
      Person: 2300
