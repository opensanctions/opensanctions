title: Iraq Terrorist Fund Freezing List
entry_point: crawler.py
prefix: iq-aml
coverage:
  frequency: daily
  start: 2025-02-13
load_statements: true
ci_test: false  # LLM-based transliteration is too costly to run in CI
summary: >
  Individuals and entities suspected of involvement in money laundering or terrorist
  financing activities, sourced from Iraq's local freezing list.
description: |
  Iraq's local sanctions list of individuals and entities designated by the Committee
  for Freezing Terrorists' Funds, established under the Anti-Money Laundering and
  Counter-Terrorism Financing Law No. 39 of 2015. Banks and other financial
  institutions must freeze the funds of listed persons and refrain from dealing with
  them until the designation is lifted. Designation decisions are published in the
  official gazette, al-Waqa'i al-Iraqiya.

  This dataset does not include the UN Security Council and foreign-country
  sanctions lists that the office also republishes.
publisher:
  name: مكتب مكافحة غسل الأموال وتمويل الإرهاب
  name_en: Office of Combating Money Laundering and Terrorist Financing
  description: >
    The Office of Combating Money Laundering and Terrorist Financing operates within the Central Bank of Iraq with financial and
    administrative independence. It maintains Iraq's
    sanctions lists, enforces asset-freezing orders and handles appeals and
    delisting requests.
  url: https://aml.iq/?lang=en
  official: true
  country: iq
url: https://aml.iq
data:
  url: https://api.aml.iq/api/localsanctionslist/getall/1?Name=&IsExcelExport=true
  format: XLSX
tags:
  - list.sanction
  - risk.terror
dates:
  formats: ["%Y"]

assertions:
  min:
    schema_entities:
      Person: 5000
      LegalEntity: 20
  max:
    schema_entities:
      Person: 10000
      LegalEntity: 50

lookups:
  type.date:
    options:
      # Implausible birth years from source data-entry errors.
      - match:
          - "198"
          - "28138"
        value: null
  alias_not_name:
    # Court sentences entered in the alias field, not aliases.
    options:
      - match:
          - مؤبد
          - "15 عشر سنة"
          - اعدام
        value: null
