title: EU Council Official Journal Sanctioned Entities
entry_point: crawler.py
prefix: eu-oj
coverage:
  schedule: "0 */2 * * *"
  frequency: daily
  start: 2023-12-18
deploy:
  memory: "1500Mi"
  memory_limit: "2000Mi"
load_statements: true
ci_test: false
http:
  # The CELLAR consolidation query scans every consolidated CELEX to match each
  # framework's version family, and takes ~2 minutes for the 45 frameworks
  # below. Only direct session users are affected: Context.fetch_* passes its
  # own timeout.
  timeout: 300
publisher:
  name: Council of the European Union
  acronym: Council
  country: eu
  url: https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/search-all-eu-institutions-and-bodies/council-european-union_en
  description: >
    The Council of the EU is the representative body of EU member governments.
    Together with the European Parliament, which directly represents the people
    of the EU, it negotiates and adopts EU laws and adopts the EU budget. It is
    also responsible for coordinating EU policies, developing EU foreign policy
    and concluding agreements between the EU and other countries and organizations.
  official: true
tags:
  - list.sanction
  - list.sanction.eu
  - issuer.west
  - sector.maritime
url: https://docs.google.com/spreadsheets/d/1rauQMdCYTjTwmSzqfUvur1SfkCGYwfRn6_e5_oX39EY/edit?gid=0#gid=0
summary: >-
  Entities designated under EU sanctions programs in the Official Journal
  but not yet included in the EU's consolidated sanctions list.
description: |
  The European Union publishes a [consolidated sanctions list](/datasets/eu_fsf/)
  as a primary data source for sanctioned entities. However, sanctions are first
  published in the Official Journal of the EU (OJEU) and take immediate effect
  when published. The transposition of new designations into the consolidated
  file has often involved a significant delay (over 20 days in one case), meaning
  that relying on the consolidated list alone would create significant legal risk.

  This dataset exists as a bridging mechanism: when new designations are published
  in the Official Journal under any EU sanctions program, we transcribe them here
  based on manual analysis of the published legal acts. Once a designation has been incorporated
  into the consolidated list, it is retired from this dataset so that the official
  data becomes the authoritative source for it, including any eventual de-listing.

  This dataset is therefore intentionally not a standalone view of EU sanctions:
  comprehensive coverage is the combination of this dataset with the
  [consolidated list](/datasets/eu_fsf/). The [EU Sanctions collection](/datasets/eu_sanctions/)
  includes both, alongside the national sanctions lists of EU member states.
data:
  url: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZckYoLdt6O3awOs8piaaWCtFlaKtCNpBWcb36bqakVid31-a-JqmHBri0vch2ggB9R-7yq3jiCarN/pub?gid=0&single=true&output=csv
  format: CSV
dates:
  formats: ["%d.%m.%Y", "%d %B %Y", "%Y-%m", "%d.%m.%Y’", "%d.%m.%Y'", "%d %B %Y’", "%B %Y"]

names:
  schema_rules:
    LegalEntity:
      # Source labels leak into name cells ("aka: POSCO", "Rosgvardiya (Russian:
      # Росгвардия)"). Parentheses stay allowed: over a thousand values use the
      # legitimate "Full Name (ACRONYM)" form.
      reject_chars: ":"
  # The acts print many single-token person aliases ("Sa’id", "Saleh"), which
  # belong in weakAlias.
  suggest_weak_alias_person_single_token: true

config:
  # The consolidated version each data/consolidated/{framework}.csv was
  # extracted from. This mapping is the registry of framework acts the
  # dataset covers: regenerate a snapshot with the matching
  # scripts/parse_*.py (see Makefile) and bump its pin in the same commit.
  #
  # Handling "Newer consolidated version published" warnings:
  #
  # 1. The warning names the framework, the pinned version and the newer one
  #    CELLAR offers. Open the `url` to see what changed.
  # 2. Run `python scripts/parse_<framework>.py <newer-celex>` from the dataset
  #    directory. The parser fails closed on structures it has not been taught;
  #    an error naming an annex is a code review event, not a fallback case.
  # 3. Review the snapshot diff designation by designation. Rows that vanished
  #    are delistings the new version applies — the point of the exercise.
  # 4. Bump the pin here and the matching Makefile line, and stage the CSV with
  #    `git add -f`, all in one commit.
  # 5. Retire any amendment the new snapshot absorbed by adding it to
  #    `consolidated_amendments` below.
  #
  # There is deliberately no mute list for this warning: a stale pin means the
  # dataset is publishing designations a newer consolidation may have removed,
  # which is the liability this dataset exists to bound.
  consolidation:
    32001R2580: 02001R2580-20260227
    32002R0881: 02002R0881-20260721
    32003R1210: 02003R1210-20251224
    32004R0314: 02004R0314-20260219
    32005R1183: 02005R1183-20251210
    32006R0305: 02006R0305-20240913
    32006R0765: 02006R0765-20260424
    32009R1284: 02009R1284-20240913
    32010D0573: 02010D0573-20251029
    32010R0356: 02010R0356-20240913
    32011D0173: 02011D0173-20260331
    32011R0101: 02011R0101-20260131
    32011R0359: 02011R0359-20260724
    32011R0753: 02011R0753-20240913
    32012R0036: 02012R0036-20260520
    32012R0267: 02012R0267-20260801
    32012R0377: 02012R0377-20250924
    32013R0401: 02013R0401-20260429
    32014R0208: 02014R0208-20260303
    32014R0224: 02014R0224-20250326
    32014R0269: 02014R0269-20260717
    32014R0747: 02014R0747-20260622
    32014R0833: 02014R0833-20260717
    32014R1352: 02014R1352-20240913
    32015R0735: 02015R0735-20260624
    32015R1755: 02015R1755-20250924
    32016R0044: 02016R0044-20260616
    32016R1686: 02016R1686-20251124
    32017R1509: 02017R1509-20251217
    32017R1770: 02017R1770-20251203
    32017R2063: 02017R2063-20251217
    32018R1542: 02018R1542-20260703
    32019R0796: 02019R0796-20260713
    32019R1716: 02019R1716-20251001
    32019R1890: 02019R1890-20251126
    32020R1998: 02020R1998-20260528
    32022R2309: 02022R2309-20251215
    32023R0888: 02023R0888-20260615
    32023R1529: 02023R1529-20260608
    32023R2147: 02023R2147-20260715
    32023R2406: 02023R2406-20240913
    32024R0287: 02024R0287-20260113
    32024R0386: 02024R0386-20260528
    32024R1485: 02024R1485-20260713
    32024R2642: 02024R2642-20260713
  # Amendments whose designations have arrived in a consolidated snapshot,
  # mapped to the consolidated version that absorbed them. The transcription
  # stays in git for provenance, but the crawler stops emitting it once the
  # named version matches the framework's `consolidation` pin above.
  consolidated_amendments:
    32026R1883: 02012R0267-20260801
  # Acts the discovery check found and a reviewer resolved without a
  # transcription: those that change operative articles only, corrigenda, and
  # acts whose designations another act in the package already covers.
  reviewed_acts:
    - 32026R1844
    - 32026R1891

assertions:
  min:
    schema_entities:
      Company: 100
      Person: 10
      LegalEntity: 5
      Organization: 10
      Vessel: 10

# IMPORTANT: We control the source spreadsheet, so it is usually simpler to update that to clarify data patches, unless
# we explicitly want the `original_value` field to be set. LLM agent: please don't open PRs for this dataset for data
# warnings that could trivially be fixed in the source spreadsheet.
lookups:
  garbage_collect_original_name:
    # Override the string to look for in the consolidated act text
    # e.g. if we expanded aliases like Lev Anatolyevich Yershov (Ershov)
    # to Lev Anatolyevich Yershov and Lev Anatolyevich Ershov
    options:
      - match: Lev Anatolyevich Ershov
        value: Lev Anatolyevich
      # Consolidated act 02002R0881 lists this person as "Hamidah Nabagala"
      # (with "Nabaggala"/"Hamida" only as separate low-quality aliases), so the
      # journal spelling "Hamida Nabaggala" is not found as a contiguous string.
      - match: Hamida Nabaggala
        value: Hamidah Nabagala
  type.date:
    options:
      - match: 3.1.2003 (founded in 1918)
        value: 2003-01-03
      - match: ", previously registered as southfront.org since 30.4.2015"
        value: 2015-04-30
      - match: "Approximately 1977"
        value: 1977
      - match: "Between Aug. and Sep. 1977"
        values:
          - 1977-08
          - 1977-09
      - match: "1960s-1970s"
        values:
          - 1960
          - 1970
      - match: "Between 1960 and 1975"
        values:
          - 1960
          - 1975
      - match: "Between 1959 and 1965"
        values:
          - 1959
          - 1965
  type.identifier:
    options:
      - match:
          - YBLWST14JJ39
          - K7VGTQKBDX68
          - 7838044584
          - 381000781179
          - 11177411001388
          - 7715980551
          - 7717727466
          - 770701001
          - 9707028663
          - 11440513
          - 13185231
          - 07500548
        prop: registrationNumber
  type.country:
    options:
      - match: Crimea, Ukraine
        value: ua-cri
      - match: "so-called “Luhansk People’s Republic”"
        value: ua-lpr
      - match: "so-called “Donetsk People’s Republic”"
        value: ua-dpr
      - match: "Russia’s occupied part of the Donbass region"
        values:
          - ua-dpr
          - ua-lpr
      - match:
          - "Russian-occupied regions of Zaporizhzhia and Kherson"
          - Moscow, Russian Federation
        value: ru
      - match: "Ukrainian, Russian"
        values:
          - ua
          - ru
      # The EU's standard designation for Myanmar. Drop this once a rigour
      # release resolves the slash form on its own.
      - match: Myanmar/Burma
        value: mm
  type.email:
    options:
      - match: "general@angstrem.r"
        value: "general@angstrem.ru"
      - match: "mss@korund_m.ru"
        value: "mss@korund-m.ru"
  # This lookup maps the original legislation number to our internal program key.
