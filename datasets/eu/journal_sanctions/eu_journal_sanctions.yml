title: EU Council Official Journal Sanctioned Entities
entry_point: crawler.py
prefix: eu-oj
coverage:
  schedule: "0 */4 * * *"
  frequency: daily
  start: 2023-12-18
deploy:
  memory: "1500Mi"
  memory_limit: "2000Mi"
  issues_turns: 300
load_statements: true
ci_test: false
http:
  # The CELLAR consolidation query scans every consolidated CELEX to match each
  # framework's version family, and takes ~2 minutes for the 45 frameworks.
  # `zavod --debug crawl` skips the CELLAR discovery checks, which is the fast
  # way to iterate on the reviewed CSVs.
  timeout: 300
publisher:
  name: Council of the European Union
  acronym: Council
  country: eu
  url: https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/search-all-eu-institutions-and-bodies/council-european-union_en
  description: >
    The Council of the EU is the representative body of EU member governments.
    Together with the European Parliament, which directly represents the people
    of the EU, it negotiates and adopts EU laws and adopts the EU budget. It is
    also responsible for coordinating EU policies, developing EU foreign policy
    and concluding agreements between the EU and other countries and organizations.
  official: true
tags:
  - list.sanction
  - list.sanction.eu
  - issuer.west
  - sector.maritime
url: https://docs.google.com/spreadsheets/d/1rauQMdCYTjTwmSzqfUvur1SfkCGYwfRn6_e5_oX39EY/edit?gid=0#gid=0
summary: >-
  Entities designated under EU sanctions programs in the Official Journal
  but not yet included in the EU's consolidated sanctions list.
description: |
  The European Union publishes a [consolidated sanctions list](/datasets/eu_fsf/)
  as a primary data source for sanctioned entities. However, sanctions are first
  published in the Official Journal of the EU (OJEU) and take immediate effect
  when published. The transposition of new designations into the consolidated
  file has often involved a significant delay (over 20 days in one case), meaning
  that relying on the consolidated list alone would create significant legal risk.

  This dataset exists as a bridging mechanism: when new designations are published
  in the Official Journal under any EU sanctions program, we transcribe them here
  based on manual analysis of the published legal acts. Once a designation has been incorporated
  into the consolidated list, it is retired from this dataset so that the official
  data becomes the authoritative source for it, including any eventual de-listing.

  This dataset is therefore intentionally not a standalone view of EU sanctions:
  comprehensive coverage is the combination of this dataset with the
  [consolidated list](/datasets/eu_fsf/). The [EU Sanctions collection](/datasets/eu_sanctions/)
  includes both, alongside the national sanctions lists of EU member states.
data:
  url: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZckYoLdt6O3awOs8piaaWCtFlaKtCNpBWcb36bqakVid31-a-JqmHBri0vch2ggB9R-7yq3jiCarN/pub?gid=0&single=true&output=csv
  format: CSV
dates:
  formats:
    [
      "%d.%m.%Y",
      "%d %B %Y",
      "%Y-%m",
      "%d.%m.%Y’",
      "%d.%m.%Y'",
      "%d %B %Y’",
      "%B %Y",
      "%d %b. %Y",
      "%d %b %Y",
      "%d %b.%Y",
      "%b. %Y",
      "%b %Y",
      "%B %d, %Y",
      "%d.%m.%Y.",
      "%d %B %Y.",
      "%d.%m. %Y",
      "%d.%m %Y",
      "%d/%m/%Y",
    ]

names:
  schema_rules:
    LegalEntity:
      # Source labels leak into name cells ("aka: POSCO", "Rosgvardiya (Russian:
      # Росгвардия)"). The crawler splits the printed "Full Name (ACRONYM)" form
      # into `abbreviation`, so a parenthesis that survives that marks a shape
      # nobody has classified yet.
      reject_chars: ":()"
    Vessel:
      # Vessel matches its own spec rather than the LegalEntity one above.
      reject_chars: "()"
  # The acts print many single-token person aliases ("Sa’id", "Saleh"), which
  # belong in weakAlias.
  suggest_weak_alias_person_single_token: true

config:
  # This section is the registry of the EU legal acts the dataset covers. The
  # crawler compares the registry with CELLAR and gives a warning when the
  # registry is behind the Official Journal. Two warnings ask for work here.
  # Obey the full procedure for the warning you get.
  #
  # Before you write a CSV in data/, read data/FORMAT.md. It is the contract
  # for both file kinds. Before you change a parser in scripts/, read
  # scripts/CLAUDE.md.
  #
  # To read the text of an act, get the body HTML with its annex tables:
  #
  #     python -m zavod.shed.ojeu.cellar <CELEX> --body-only --output act.html
  #
  # This dataset has ci_test: false. Do not crawl. Verify a change with
  # `python scripts/validate.py` and `contrib/lint_dataset.sh <dataset>.yml`.
  #
  # The procedure for each warning is above the key that the procedure
  # changes. A comment block here holds a maximum of 32 lines: the YAML
  # check in CI rejects more before a key.

  # The consolidated version that each data/consolidated/{framework}.csv
  # snapshot comes from. The Makefile gives the same version to the parser.
  #
  # These two warnings show an error in this mapping. Correct the mapping.
  # - "Snapshot has no consolidation pin": a file in data/consolidated/ has no
  #   entry here. Add the pin, or delete the file.
  # - "Pinned consolidation is not published by CELLAR": the pin has an error,
  #   or CELLAR withdrew the version. Correct the pin.
  consolidation:
    32001R2580: 02001R2580-20260227
    32002R0881: 02002R0881-20260721
    32003R1210: 02003R1210-20251224
    32004R0314: 02004R0314-20260219
    32005R1183: 02005R1183-20251210
    32006R0305: 02006R0305-20240913
    32006R0765: 02006R0765-20260424
    32009R1284: 02009R1284-20240913
    32010D0573: 02010D0573-20251029
    32010R0356: 02010R0356-20240913
    32011D0173: 02011D0173-20260331
    32011R0101: 02011R0101-20260131
    32011R0359: 02011R0359-20260724
    32011R0753: 02011R0753-20240913
    32012R0036: 02012R0036-20260520
    32012R0267: 02012R0267-20260801
    32012R0377: 02012R0377-20250924
    32013R0401: 02013R0401-20260429
    32014R0208: 02014R0208-20260303
    32014R0224: 02014R0224-20250326
    32014R0269: 02014R0269-20260717
    32014R0747: 02014R0747-20260622
    32014R0833: 02014R0833-20260717
    32014R1352: 02014R1352-20240913
    32015R0735: 02015R0735-20260624
    32015R1755: 02015R1755-20250924
    32016R0044: 02016R0044-20260616
    32016R1686: 02016R1686-20251124
    32017R1509: 02017R1509-20251217
    32017R1770: 02017R1770-20251203
    32017R2063: 02017R2063-20251217
    32018R1542: 02018R1542-20260703
    32019R0796: 02019R0796-20260713
    32019R1716: 02019R1716-20251001
    32019R1890: 02019R1890-20251126
    32020R1998: 02020R1998-20260528
    32022R2309: 02022R2309-20251215
    32023R0888: 02023R0888-20260615
    32023R1529: 02023R1529-20260801
    32023R2147: 02023R2147-20260715
    32023R2406: 02023R2406-20240913
    32024R0287: 02024R0287-20260113
    32024R0386: 02024R0386-20260528
    32024R1485: 02024R1485-20260713
    32024R2642: 02024R2642-20260713
  # ## Warning "Newer consolidated version published"
  #
  # CELLAR has a consolidated version of a framework act that is newer than the
  # pin in `consolidation`. The snapshot in data/consolidated/ is stale.
  #
  # 1. Open the `url` in the warning. Read the change.
  # 2. Run `python scripts/parse_<framework>.py <latest>` from this directory.
  #    The parser stops with an error when the document has a structure that
  #    the parser does not know. Change that one parser, and teach it only the
  #    structure that the document shows. Do not add a general fallback.
  # 3. Read the diff of data/consolidated/<framework>.csv designation by
  #    designation. Rows that are gone are delistings. They are the purpose of
  #    the update.
  # 4. Change the pin in `consolidation` and the related line in the Makefile.
  #    The two must give the same version.
  # 5. Retire the amendments that the new snapshot absorbed. Find each file in
  #    data/amendments/ whose `amendedCelex` is this framework. Compare its
  #    rows with the new snapshot. If the snapshot has the designations, add
  #    the amendment below with the new version. If the snapshot does not have
  #    them, do not change the entry. Do not delete the amendment file.
  # 6. Run `python scripts/validate.py`. Put all of these changes in one
  #    commit.
  #
  # There is deliberately no mute list for this warning: a stale pin means the
  # dataset is publishing designations a newer consolidation may have removed,
  # which is the liability this dataset exists to bound.
  #
  # The crawler stops to emit an amendment when the version here agrees with
  # the `consolidation` pin of its framework. The transcription stays in git
  # as provenance.
  consolidated_amendments:
    32026R1883: 02012R0267-20260801
  # ## Warning "Amending act has no reviewed transcription"
  #
  # An act changes an annex of a framework act, and no reviewed file holds the
  # designations of that act. The designations are in no input of the dataset.
  #
  # 1. Get the act. The warning gives the CELEX, the title and the EUR-Lex url.
  # 2. Find the annexes that add or change a designated party.
  # 3. If the act designates no party, add the CELEX below and stop. Acts that
  #    change operative articles only, and corrigenda, go there.
  # 4. A sanctions package is usually a CFSP decision and a regulation with the
  #    same designations. Transcribe the regulation. Add the CELEX of the
  #    decision below. data/FORMAT.md gives the full rule.
  # 5. Write all designations of the act to data/amendments/<CELEX>.csv. One
  #    file holds the complete act. A part of the act is not sufficient.
  #    data/FORMAT.md gives the columns, the fidelity rules and the row rules.
  # 6. Run `python scripts/format.py data/amendments/<CELEX>.csv`, then
  #    `python scripts/validate.py`.
  # 7. In the PR, name each annex you transcribed and the number of rows it
  #    gave. Name each annex that has no designated party.
  #
  # Acts that the discovery check found and that a reviewer closed with no
  # transcription.
  reviewed_acts:
    - 32026R1844
    # Deletes the entries of four natural persons from Annex III and renews the
    # regime; it designates nobody, and amendment files hold positive state only.
    - 32026R1853
    # The Article 7 review re-adopts Annex II unchanged: its 13 persons and 23
    # entities are the same entries, in the same numbering, as the pinned
    # snapshot 02001R2580-20260227 in data/consolidated/32001R2580.csv.
    - 32026R1878
    - 32026R1891

assertions:
  min:
    schema_entities:
      Company: 100
      Person: 10
      LegalEntity: 5
      Organization: 10
      Vessel: 10

