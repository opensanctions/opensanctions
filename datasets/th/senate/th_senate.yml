  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: false
summary: >-
  Members of the Senate of Thailand, the upper chamber of the National Assembly.
description: |
  Current members of the Senate, the upper chamber of the bicameral National Assembly of
  Thailand. Its 200 senators are indirectly selected across 20 occupational groups for a
  five-year term and, together with the House of Representatives, hold the country's
  legislative power, including passing laws and approving the budget.

  This dataset records each senator with their name, occupational group, and the dates
  their term began and (where applicable) ended.
url: https://datacatalog.senate.go.th/dataset/sec_03_1101
publisher:
  name: Secretariat of the Senate
  acronym: Senate
  description: >
    The Secretariat of the Senate publishes the roster of the Senate of Thailand, the
    upper chamber of the National Assembly, through its open-data catalogue.
  url: https://www.senate.go.th/
  country: th
  official: true
