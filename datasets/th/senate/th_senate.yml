title: Thailand Members of the Senate
name: th_senate
prefix: th-sen
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-08-12
load_statements: true
ci_test: false
summary: >-
  Upper chamber of the National Assembly, selected across 20 occupational groups
description: |
  Current and historical members of the Senate (วุฒิสภา), the upper chamber of the
  bicameral National Assembly of Thailand. Its 200 senators are indirectly selected across
  20 occupational groups for a five-year term and, together with the House of
  Representatives, hold the country's legislative power, including passing laws and
  approving the budget.

  Coverage spans the chamber's consecutive sets, so senators of earlier sets are included
  alongside the sitting one.
url: https://datacatalog.senate.go.th/dataset/sec_03_1101
publisher:
  name: Secretariat of the Senate
  acronym: Senate
  description: >
    The Secretariat of the Senate publishes the roster of the Senate of Thailand, the
    upper chamber of the National Assembly, through its open-data catalogue.
  url: https://www.senate.go.th/
  country: th
  official: true
data:
  # CKAN package keyed on the dataset's stable slug (sec_03_1101). The crawler reads
  # every Senate set listed in its resources straight from the datastore API, so
  # neither a resource-ID nor a filename change breaks fetching.
  url: https://datacatalog.senate.go.th/api/3/action/package_show?id=sec_03_1101
  format: JSON
  lang: tha

dates:
  formats: ["%d/%m/%Y", "%Y-%m-%dT%H:%M:%S"]

