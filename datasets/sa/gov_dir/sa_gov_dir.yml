# Non-minister positions ("Head of <agency>") are emitted once categorised in the UI.
title: Saudi Arabia Government Directory
entry_point: crawler.py
prefix: sa-gov
coverage:
  frequency: monthly
  start: 2026-11-23
load_statements: true
ci_test: false # Needs the Zyte API.
summary: >-
  Heads of ministries, regional emirates and other public bodies in Saudi Arabia
description: |
  Current heads of the ministries, regional emirates, authorities, councils, courts
  and other public bodies listed in Saudi Arabia's Directory of Government Entities.
  Ministers are appointed by royal order and sit on the Council of Ministers, chaired
  by the Prime Minister.

  Heads of bodies that confer no political exposure, such as universities and
  hospitals, are left out, as are the Prime Minister and the ministers of state.
url: https://my.gov.sa/en/agencies
publisher:
  name: هيئة الحكومة الرقمية
  name_en: Digital Government Authority
  acronym: DGA
  description: >
    The Digital Government Authority regulates and develops digital government in
    Saudi Arabia. It runs the Unified National Platform (my.gov.sa), whose Directory
    of Government Entities names the head of each government body.
  url: https://dga.gov.sa/
  country: sa
  official: true
data:
  url: https://my.gov.sa/sitemap.xml
  format: XML
  lang: eng

tags:
  - list.pep

names:
  prefixes_strip:
    - Doctor
    - Dr.
    - Dr
    - Eng.
    - H.E.
    - His Excellency
    - His Highness /
    - His Highness
    - His Royal Highness
    - Mr.
    - Prince
    - Prof.
    # Stray Arabic diacritics.
    - "ٍ"
    - "ِ"
  suffixes_strip:
    - ",PhD"
    - ", PhD"
    - ", DVM"

lookups:
  # "Ministry of …" agencies whose type misleads, by agency ID: "minister" says whether a
  # minister heads it. Any other "Ministry of …" outside the "Ministries" type warns.
  minister:
    options:
      - match: "17342" # National Guard Health Affairs: typed Ministries, run by a CEO
        minister: false
      - match: "17627" # Ministry of Defense: typed Other
        minister: true
  # Agency titles with typos, or cut off at 80 characters.
  agency_title:
    options:
      - match: General Directorate of Public Pecurity
        value: General Directorate of Public Security
      - match: General Secretariat of the Military Service Councel
        value: General Secretariat of the Military Service Council
      - match: Human Rights Commision
        value: Human Rights Commission
      - match: General Commission for the Guardianship of Trust Funds for Miniros and their Cou
        value: General Commission for the Guardianship of Trust Funds for Minors and their Counterparts
      - match: privet sector partnership program
        value: Private Sector Partnership Program
      - match: The General Authority for the Affairs of the Grand Mosque and the Prophet's Mosq
        value: The General Authority for the Affairs of the Grand Mosque and the Prophet's Mosque
      - match: The General Organization for the Conservation of Coral Reefs and Turtles in the
        value: The General Organization for the Conservation of Coral Reefs and Turtles in the Red Sea
      - match: The National Research and Development Center for Sustainable Agriculture (Estida
        value: The National Research and Development Center for Sustainable Agriculture (Estidamah)
      - match: Immam Mohammed Bin Saud Islamic University
        value: Imam Mohammed Bin Saud Islamic University
      - match: Council of Universities's Affairs
        value: Council of Universities' Affairs

assertions:
  min:
    schema_entities:
      Person: 170
      Position: 170
    country_entities:
      sa: 170
  max:
    schema_entities:
      Person: 300
      Position: 300
