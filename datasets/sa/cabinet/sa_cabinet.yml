title: Saudi Arabia Ministers
entry_point: crawler.py
prefix: sa-min
coverage:
  frequency: monthly
  start: 2026-11-17
load_statements: true
ci_test: false # Needs the Zyte API.
summary: >-
  Ministers heading the ministries of the Saudi government
description: |
  Current ministers heading the ministries of the Kingdom of Saudi Arabia. Ministers
  are appointed by royal order and sit on the Council of Ministers, which the Prime
  Minister chairs and which sets and executes the state's internal, external,
  financial and economic policy.

  The Prime Minister and the ministers of state, who sit on the Council without
  heading a ministry, are not included, nor is the Minister of Defense, whose
  ministry the source does not list. The source names each ministry's head without
  appointment dates and is updated by hand, so it can lag behind a cabinet reshuffle.
url: https://my.gov.sa/en/agencies
publisher:
  name: هيئة الحكومة الرقمية
  name_en: Digital Government Authority
  acronym: DGA
  description: >
    The Digital Government Authority regulates and develops digital government in
    Saudi Arabia. It runs the Unified National Platform (my.gov.sa), whose Directory
    of Government Entities names the head of each government body.
  url: https://dga.gov.sa/
  country: sa
  official: true
data:
  url: https://my.gov.sa/sitemap.xml
  format: XML
  lang: eng

tags:
  - list.pep

names:
  prefixes_strip:
    - Dr.
    - Eng.
    - Mr.
    - Prince

lookups:
  # Agencies filed under Ministries that no minister heads, by agency ID; skipped.
  not_ministry:
    options:
      - match: "17342" # National Guard Health Affairs, run by a chief executive
        value: skip
      - match: "17909" # King Faisal Medical City for Southern Regions
        value: skip
      - match: "18116" # Special Forces for Environmental Security, under a commander
        value: skip
      - match: "18275" # Prince Saud Al Faisal Institute for Diplomatic Studies
        value: skip

assertions:
