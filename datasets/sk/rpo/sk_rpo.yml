title: Slovakia Commercial Register
prefix: sk-rpo
disabled: false
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-11-03
deploy:
  memory: 4Gi
  disk: 20Gi
exports:
  - statistics.json
  - entities.ftm.json
  - entities.delta.json
resolve: false
ci_test: false
summary: >-
  Active Slovak companies with their directors, partners and legal successions.
description: |
  Companies registered in the Slovak Commercial Register (Obchodný register), as
  published in the bulk export of the Register of Legal Entities, Entrepreneurs and
  Public Authorities (RPO). The dataset covers companies that have not been
  dissolved, with their statutory bodies, supervisory board members, partners and
  shareholders, procurators, and the companies they succeeded or were succeeded by.

  The register does not publish dates of birth or personal identification numbers of
  the people involved. Beneficial ownership data has not been public in the RPO since
  July 2025. The RPO data is published under the Creative Commons Attribution 4.0
  licence.
url: https://rpo.minv.sk/rpo-api-doc.html
publisher:
  name: Ministerstvo vnútra Slovenskej republiky
  name_en: Ministry of Interior of the Slovak Republic
  acronym: MV SR
  url: https://www.minv.sk
  description: |
    The Ministry of Interior is the operator of the Register of Legal Entities,
    Entrepreneurs and Public Authorities (RPO), which consolidates the data of the
    Slovak source registers, including the Commercial Register.
  country: sk
  official: true
data:
  url: https://frkqbrydxwdp.compat.objectstorage.eu-frankfurt-1.oraclecloud.com/susr-rpo/
  format: JSON
  lang: slk

assertions:
  min:
    schema_entities:
      Company: 340_000
      Person: 900_000
      Ownership: 1_100_000
      Directorship: 1_000_000
  max:
    schema_entities:
      Company: 500_000
      Person: 1_400_000
      Ownership: 1_700_000
      Directorship: 1_600_000

lookups:
  legal_form:
    options:
      - match:
          - Spoločnosť s ručením obmedzeným
          - Akciová spoločnosť
          - Komanditná spoločnosť
          - Verejná obchodná spoločnosť
          - Jednoduchá spoločnosť na akcie
          - Európska spoločnosť
          - Štátny podnik
          - Obecný podnik
          - Zahraničná osoba, právnická osoba so sídlom mimo územia SR
          - Podnik zahraničnej osoby (organizačná zložka podniku zahraničnej osoby)
          - Organizačná zložka podniku
        schema: Company
      - match:
          - Družstvo
          - Európske družstvo
          - Európske zoskupenie hospodárskych záujmov
          - Nešpecifikovaná právna forma
        schema: Organization
  # Members of statutory bodies are always directors; this maps the other parties.
  stakeholder_type:
    options:
      - match:
          - Spoločník v.o.s. / s.r.o.
          - Jediný akcionár a.s.
          - Komanditista
          - Komplementár
          - Zriaďovateľ ZO
          - Zakladateľ štátneho podniku
          - Člen EZHZ
        value: Ownership
      - match:
          - Člen dozorného orgánu
          - Člen správnej rady
          - Vedúci podniku zahraničnej osoby / organizačnej zložky podniku zahraničnej osoby
        value: Directorship
      - match:
          - Prokurista
          - Správca konkurznej podstaty
          - Správca reštrukturalizačného konania
          - Správca vyrovnacieho konania
        value: Representation
      # Partnerships whose assets were taken over are covered by the successions.
      - match:
          - v.o.s., ktorej imanie sa preberá
          - Spoločník v.o.s., ktorý prevzal jej imanie
          - Neurčené
        value: skip
  # Short but real place names, curated to mark them reviewed.
  type.address:
    options:
      - match: Zug
        value: Zug
      - match: Koš
        value: Koš
      - match: Tôň
        value: Tôň
      - match: Láb
        value: Láb
      - match: Iža
        value: Iža
      # Legal form suffix entered as an address, dropped.
      - match: Kft
        value: null
  type.name:
    options:
      - match: "5638/20"
        value: null
      # Genuine company name that uses angle brackets.
      - match: "Business system: (? < > /) s.r.o."
        value: "Business system: (? < > /) s.r.o."
        silence_warnings: [xss-html-smell]
  # UN M49 codes (codelist CL000086) to ISO 3166-1 alpha-2.
  country:
    options:
      # Unspecified, stateless, and the dissolved Netherlands Antilles.
      - match: ["530", "898", "998"]
