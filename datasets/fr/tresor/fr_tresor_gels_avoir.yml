  #     fiscale" is a taxNumber, however much the digits look like an INN.
  #   - A code whose scheme the source doesn't name is a registrationNumber, not a note.
  #   - Comment an option only where mapping it took a judgement that needed context
  #     beyond the field itself, such as a modelling choice or outside knowledge about
