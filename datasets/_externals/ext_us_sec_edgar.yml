type: external
title: US SEC EDGAR Filers
entry_point: zavod.runner.local_enricher:enrich
full_dataset: us_sec_edgar
disabled: false
hidden: false
coverage:
  frequency: weekly
  start: 2026-11-07
exports:
  - statistics.json
  - entities.delta.json
deploy:
  cpu: "2000m"
  memory: "4000Mi"
  memory_limit: "6000Mi"
  disk: "100Gi"
load_statements: true
ci_test: false
summary: >-
  Companies and funds filing with the US Securities and Exchange Commission
  which match entities in the OpenSanctions database.
url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
publisher:
  name: Securities and Exchange Commission
  acronym: SEC
  url: https://www.sec.gov
  country: us
  official: true

inputs:
  - ann_graph_topics
  - debarment
  - enforcement
  - regulatory
  - sanctions
  - special_interest
  - us_sec_litigation

config:
  topic_gated: true
  index_options:
    memory: 3000
  threshold: 0.7
  algorithm: regression-v1
  topics:
    - role.pep
    - role.rca
    - sanction
    - sanction.linked
    - sanction.control
    - sanction.counter
    - export.control
    - export.control.linked
    - invest.ban
    - invest.risk
    - debarment
    - reg.action
    - reg.warn
    - asset.frozen
    - poi
    - gov.soe
  schemata:
    - Company
    - Organization
