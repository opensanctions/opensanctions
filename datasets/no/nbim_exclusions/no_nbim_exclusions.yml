title: "Norges Bank Investment Management observation and exclusion of companies"
entry_point: crawler.py
prefix: no-nbim
coverage:
  frequency: daily
  start: 2023-10-18
load_statements: true
summary: >-
  Companies excluded from investment by Norway's Government Pension Fund Global, or listed for observation.
description: |
  This dataset lists companies which are excluded from investment by Norway's
  Government Pension Fund Global, or placed under observation. Until November 2025,
  Norges Bank's Executive Board made these decisions under guidelines from Norway's
  Ministry of Finance, for an unacceptable risk that the company contributes to or
  is responsible for:

  - production of coal or coal-based energy
  - production of tobacco, cannabis, nuclear weapons or cluster munitions
  - serious or systematic human rights violations
  - serious violations of individuals' rights in situations of war or conflict
  - sales of weapons to states in armed conflict that use them in breach of the
    international rules on the conduct of hostilities
  - sales of weapons or military materiel to states subject to investment
    restrictions on government bonds
  - severe environmental damage
  - unacceptable greenhouse gas emissions
  - gross corruption or other serious financial crime
  - other particularly serious violations of fundamental ethical norms

  Under temporary guidelines pending a new ethical framework, Norges Bank makes no
  new exclusion or observation decisions, but may revoke existing ones.
url: https://www.nbim.no/en/responsible-investment/exclusion-of-companies/
publisher:
  name: Norges Bank Investment Management
  acronym: NBIM
  description: |
    Norges Bank Investment Management (NBIM) is a branch of Norges Bank, Norway's central bank.
    It is responsible for the operational management of Norway's Government Pension Fund Global.
    Their objective is the highest possible return on the fund, aiming to
    achieve this in a safe, efficient, responsible and transparent manner,
    and within government guidelines.
  country: "no"
  url: https://www.nbim.no/en/
  official: true
data:
  url: https://www.nbim.no/en/responsible-investment/exclusion-of-companies/
  format: HTML
dates:
