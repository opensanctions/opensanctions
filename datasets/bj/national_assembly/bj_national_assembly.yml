title: Benin Members of the National Assembly
entry_point: crawler.py
prefix: bj-parl
coverage:
  frequency: monthly
  start: 2026-11-24
load_statements: true
ci_test: true
summary: >-
  Elected lower house of Benin's Parliament, alongside the appointed Senate
description: |
  Current members of the National Assembly of Benin (Assemblée nationale), the lower
  house of the country's bicameral Parliament. Its deputies are elected by direct
  universal suffrage from party lists for a seven-year term. They pass laws, approve
  the budget and oversee the government.
url: https://assemblee-nationale.bj/
publisher:
  name: Assemblée nationale du Bénin
  name_en: National Assembly of Benin
  acronym: AN
  description: >
    The National Assembly is the lower house of the Parliament of the Republic of
    Benin.
  url: https://assemblee-nationale.bj/
  country: bj
  official: true
data:
  url: https://assemblee-nationale.bj/index.php/depute/menu-liste-des-deputes/liste-des-deputes/
  format: HTML
  lang: fra

tags:
  - list.pep

# Party comes from the groups page, which lags behind the list: replacement
# deputies may have no party.
assertions:
  min:
    schema_entities:
      Person: 95
      Position: 1
    country_entities:
      bj: 95
    entities_with_prop:
      Person:
        political: 85
  max:
    schema_entities:
      Person: 220
      Position: 1

lookups:
  type.name:
    options:
      # Stray control character.
      - match: "NOUTAÏ\x8f Tohouegnon Nestor"
        value: "NOUTAÏ Tohouegnon Nestor"
  # "X Epouse Y": birth name X, married name Y. The crawler warns on unlisted ones.
  married_names:
    options:
      - match: "TIBOUTE Eps SAMA Emilie"
        values: ["TIBOUTE Emilie", "SAMA Emilie"]
      - match: "SALIOU Epouse AREKPA Alidjanatou"
        values: ["SALIOU Alidjanatou", "AREKPA Alidjanatou"]
