# A year's list keeps members who left mid-year, with no per-member dates, so they
# stay current until the next year starts on 20 July. The previous year is unknown,
# not ended, until 31 December. Years before 2016 are sparse; some before 2014 empty.

lookups:
  # Member group keys; the opposition seat is not a constituency.
  constituency:
    options:
      - match: OPOSICIÓN
        value: null
  # The opposition seat gives its legal basis as its party.
  political:
    options:
      - match: C.P. Art. 112, A.L. 02 de 2015 Art. 1 y Est. de Oposición Ley, 1909 de 2018 Art. 24
        value: null

