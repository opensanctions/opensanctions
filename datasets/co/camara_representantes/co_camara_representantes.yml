title: Colombia Members of the Chamber of Representatives
prefix: co-cam
entry_point: crawler.py
coverage:
  frequency: monthly
  start: 2026-11-06
load_statements: true
summary: >-
  Elected legislators of the lower house of Colombia's bicameral Congress
description: |
  Current and historical members of the Chamber of Representatives (Cámara de
  Representantes), the lower house of the Congress of the Republic of Colombia. Its
  members are elected for a four-year term by proportional representation, in
  territorial constituencies formed by each department and the capital district, and in
  special constituencies for Afro-Colombian and indigenous communities and Colombians
  abroad. Together with the Senate, the chamber holds the country's legislative power,
  including passing laws and approving the budget.

  Members are listed by legislative year. A member who leaves the chamber during a
  legislative year remains listed until that year ends. Legislative years before 2016
  are only partly covered.
url: https://www.camara.gov.co/representantes/
