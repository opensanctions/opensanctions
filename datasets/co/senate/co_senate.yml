description: |
  Current members of the Senate of the Republic (Senado de la República), the upper
  house of the Congress of Colombia. Its senators are elected by proportional
  representation in a single nationwide constituency, with further seats reserved for
  indigenous communities and for the runner-up in the presidential election, for a
  four-year term. Together with the House of Representatives, the Senate holds
  the country's legislative power, including passing laws and approving the budget.
