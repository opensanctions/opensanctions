summary: >-
  The National Assembly of Zambia, the national unicameral legislature
description: |
  Current members of the National Assembly of Zambia, the country's unicameral
  legislature. Its members hold both constituency-based seats, proportional
  representation to women, youths and persons with disabilities, and seats filled
  by presidential nomination, all for five-year terms. They hold the country's
  legislative power, including passing laws and approving the budget.
