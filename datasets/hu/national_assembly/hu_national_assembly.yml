title: Hungary National Assembly
entry_point: crawler.py
prefix: hu-assembly
load_statements: true
ci_test: false
coverage:
  frequency: monthly
  start: 2025-11-13
summary: >
  Profiles of Members of the Hungarian Parliament, including their political affiliations.
description: |
  This dataset lists current Members of the Hungarian National Assembly (Országgyűlés),
  along with their political affiliations and terms of office. Where available, it also
  includes information on members' non-parliamentary roles, such as government positions.
publisher:
  name: Országgyűlés
  name_en: Hungarian National Assembly
  official: true
  description: |
    The Hungarian National Assembly is the unicameral legislative body of Hungary,
    responsible for enacting laws and overseeing government functions.
  country: hu
  url: https://www.parlament.hu/web/house-of-the-national-assembly
tags:
  - list.pep
url: https://www.parlament.hu/kepviselok
# The parliament's XML Web API needs a personal, non-transferable access code from
# https://www.parlament.hu/web/guest/web-api-regisztracio, read from the
# $HNA_API_PASSWORD environment variable and sent as the `access_token` parameter.
# parlament.hu CAPTCHAs every non-Hungarian IP, so requests egress via Zyte with
# geolocation HU.
data:
  url: https://www.parlament.hu/cgi-bin/web-api-pub/kepviselok.cgi
  format: xml
  lang: hun
dates:
  # The API writes dates with a trailing period, e.g. mandatum_kezdete="2026.05.09."
  formats: ["%Y.%m.%d."]

# 200 members of parliament
assertions:
  min:
    schema_entities:
      Person: 195
      Position: 1
    country_entities:
      hu: 1
