title: DR Congo Members of the National Assembly
entry_point: crawler.py
name: cd_national_assembly
prefix: cd-assembly
coverage:
  frequency: monthly
  start: 2026-07-23
load_statements: true
ci_test: true
summary: >-
  Deputies of the lower house, including substitutes who have taken up a seat
description: |
  Current members of the National Assembly (Assemblée nationale), the lower house of the
  bicameral Parliament of the Democratic Republic of the Congo. Its 500 deputies are elected
  for a five-year term in single- and multi-member constituencies and hold the country's
  legislative power, including passing laws and approving the budget.

  The dataset covers the sitting legislature. Substitutes who have taken up a seat are
  included, as are deputies whose mandate has ended or been suspended during the term.
url: https://assembleenationale.cd/tous-les-deputes/
publisher:
  name: Assemblée nationale de la République démocratique du Congo
  name_en: National Assembly of the Democratic Republic of the Congo
  description: >
    The National Assembly is the lower house of the bicameral Parliament of the
    Democratic Republic of the Congo, alongside the Senate.
  url: https://assembleenationale.cd/
  country: cd
  official: true
data:
  url: https://assembleenationale.cd/wp-json/wp/v2/deputes
  format: JSON
  lang: fra

tags:
  - list.pep

dates:
  formats: ["%d/%m/%Y"]

lookups:
  # The mandate taxonomy, as an occupancy status. The source never dates a mandate.
  mandate:
    options:
      - match: En cours
        value: current
      - match: Terminé
        value: ended
      # A suspended deputy keeps the seat without exercising it; their substitute
      # sits in their place. Neither current nor ended.
      - match: Suspendu
        value: unknown
  # Labelled items on a deputy's profile page.
  details:
    options:
      - match: Lieu de naissance
        value: birth_place
      - match: Date de naissance
        value: birth_date
      # The deputy a substitute took over from, or who took over the seat.
      - match:
          - En remplacement de
          - Remplacé(e) par
        value: null

assertions:
  min:
    schema_entities:
      Person: 490
      Position: 1
    country_entities:
      cd: 490
  max:
    schema_entities:
      Person: 1100
      Position: 1
