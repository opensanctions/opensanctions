    Q130420294: state-owned enterprise of New Zealand
    Q111179627: Malaysian state-owned enterprise
    Q5589413: government-owned and controlled corporation
    Q48851989: state-owned enterprise of the United States
    Q117406600: Belgian state-owned company
    Q48814874: state-owned enterprise of South Africa
    Q48815411: state-owned enterprise of Australia
    Q48815413: state-owned enterprise of the United Kingdom
    Q5189488: Crown corporation
    Q91418466: Perusahaan Perseroan
    Q19730819: Perusahaan Umum
    Q1389604: unitary enterprise
    Q108098624: republican unitary enterprise
    Q3591583: établissement public à caractère industriel et commercial
    Q5834296: EPE
