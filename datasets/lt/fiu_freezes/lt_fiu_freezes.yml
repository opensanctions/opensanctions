title: Lithuanian International Sanctions
entry_point: crawler.py
prefix: ltfiu
coverage:
  country: lt
  frequency: daily
  start: 2023-05-16
load_statements: true
summary: >
  Entities whose property is frozen because they are owned or controlled by a sanctioned
  entity, and persons, groups and entities associated with terrorist acts listed under
  UNSCR 1373.
description: |
  Two lists published by the country's financial intelligence unit: a small set of
  Lithuanian companies whose property is frozen because a sanctioned entity owns or
  controls them, and the natural or legal persons, groups and entities associated with
  terrorist acts whose funds and other financial assets must be frozen under UN Security
  Council Resolution 1373 (2001).
publisher:
  name: Finansinių Nusikaltimų Tyrimo Tarnyba
  name_en: Financial Crimes Investigation Service
  acronym: FNTT
  description: |
    The Financial Crimes Investigation Service at the Ministry of Internal Affairs of the
    Republic of Lithuania (Finansinių Nusikaltimų Tyrimo Tarnyba Prie Lietuvos Respublikos
    Vidaus Reikalų Ministerijos) is a law enforcement institution, which investigates the
    financial sector and sanctions violations.
  url: https://www.fntt.lt/lt/kontaktai/8
  country: lt
  official: true
url: https://fntt.lrv.lt/lt/tarptautines-finansines-sankcijos/
data:
  url: https://fntt.lrv.lt/lt/tarptautines-finansines-sankcijos/
  format: html
ci_test: false
tags:
  - list.sanction
  - publisher.west

assertions:
  min:
    schema_entities:
      Company: 15
      LegalEntity: 10
  max:
    schema_entities:
      Company: 100
      LegalEntity: 100

lookups:
