title: Lithuania State-Owned Enterprise Leadership
prefix: lt-soe
url: https://governance.lt/apie-imones/atviri-duomenys/
coverage:
  frequency: monthly
  start: "2026-11-25"
load_statements: true
entry_point: crawler.py
summary: >-
  Chief executives and board members of companies owned by the Lithuanian state
description: |
  This dataset lists the heads and the members of the boards, supervisory boards
  and management boards of state-owned enterprises in Lithuania. The Governance
  Coordination Centre publishes the list for the enterprises in which the state
  holds the shares, but not for their subsidiaries.

  The source lists the people who hold these roles today.
tags:
  - list.pep
publisher:
  name: Valdymo koordinavimo centras
  name_en: Governance Coordination Centre
  acronym: VKC
  description: |
    The Governance Coordination Centre is a public institution that monitors the
    governance and performance of state-owned enterprises in Lithuania, and
    takes part in the selection of their board members.
  country: lt
  url: https://governance.lt/
  official: true
data:
  url: https://governance.lt/apie-imones/atviri-duomenys/
  format: XLSX
  lang: lit
assertions:
  min:
    schema_entities:
      Person: 150
      Company: 30
  max:
    schema_entities:
      Person: 400
      Company: 70

lookups:
  type.gender:
    options:
      - match: V
        value: male
      - match: M
        value: female
