title: EITI State-Owned Enterprises Database
entry_point: crawler.py
prefix: eiti-soe
coverage:
  frequency: weekly
  start: "2024-08-09"
load_statements: true
ci_test: false # Gives a 403 in GitHub CI
summary: >
  List of all SOEs operating in EITI implementing countries.
description: |
  This dataset covers state-owned enterprises (SOE) that are required to make government
  payments and disclose information regarding oil, gas, and mining activities in
  EITI-implementing countries. The information is provided to facilitate the detection and
  prevention of corruption.
publisher:
  name: Extractive Industries Transparency Initiative
  acronym: EITI
  description: |
    By becoming a member of the Extractive Industries Transparency Initiative (EITI), countries commit
    to disclose information along the extractive industry value chain – from how extraction rights are
    awarded, to how revenues make their way through government and how they benefit the public. The EITI
    provides data that can help identify and close channels for corruption – not only in mining, oil and
    gas but increasingly in the renewables sector.

    In each country that has joined the EITI, a multi-stakeholder group, composed of government, companies
    and civil society, supports implementation of the EITI Standard.
    [Source: Official Website](https://eiti.org/our-mission)
  url: https://eiti.org
  official: false
url: https://eiti-database.eiti.org/eiti_database/view_soeList
data:
  url: https://eiti-database.eiti.org/eiti_database/view_soeList.json
  format: JSON

assertions:
  min:
    schema_entities:
      LegalEntity: 200
  max:
    schema_entities:
      LegalEntity: 600

lookups:
  type.url:
    options:
      # Placeholders in the website and audited statement columns
      - match:
          - "No"
          - "Yes"
          - "SI"
          - "OUI (2018)"
          - "Not available"
          - "Not applicable"
          - "Non-quoted"
          - "private"
          - "no se dispone de aquel"
          - "SNIM"
        value: null
      - match: "www.gnpcghana.com/speeches/2018_financial.pdf · PDF file"
        value: http://www.gnpcghana.com/speeches/2018_financial.pdf
      - match: "ttps://umcc.com.ua/purchase/download?file=%D0%A4%D1%96%D0%BD%D0%B0%D0%BD%D1%81%D0%BE%D0%B2%D0%B0+%D0%B7%D0%B2%D1%96%D1%82%D0%BD%D1%96%D1%81%D1%82%D1%8C+%D0%90%D0%A2+%D0%9E%D0%93%D0%A5%D0%9A+%D0%B7%D0%B0+2018+%D1%80%D1%96%D0%BA.pdf"
        value: https://umcc.com.ua/purchase/download?file=%D0%A4%D1%96%D0%BD%D0%B0%D0%BD%D1%81%D0%BE%D0%B2%D0%B0+%D0%B7%D0%B2%D1%96%D1%82%D0%BD%D1%96%D1%81%D1%82%D1%8C+%D0%90%D0%A2+%D0%9E%D0%93%D0%A5%D0%9A+%D0%B7%D0%B0+2018+%D1%80%D1%96%D0%BA.pdf
