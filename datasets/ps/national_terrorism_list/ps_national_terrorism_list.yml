title: Palestine National Terrorist Designations (UNSCR 1373)
entry_point: crawler.py
prefix: ps-terr
coverage:
  frequency: daily
  start: 2026-10-23
load_statements: true
ci_test: false # LLM-based transliteration
summary: >-
  Individuals and entities designated as terrorists on the Palestinian national
  list under UN Security Council Resolution 1373
description: |
  Individuals and entities on the national designation list of the Palestinian
  Committee for the Implementation of UN Security Council Resolutions, which
  implements UN Security Council Resolution 1373 (2001) on combating terrorism
  and its financing. Most designations target Israeli settlers and settler groups
  and outposts in the West Bank.
url: https://sanction.pgp.ps/ar/SanctionFiles_arb
publisher:
  name: لجنة تنفيذ قرارات مجلس الامن الدولي
  name_en: Committee for the Implementation of UN Security Council Resolutions
  description: |
    The committee was established under
    Article 47 of Decree-Law No. 20 of 2015 on Combating Money Laundering and
    Terrorist Financing. It implements UN Security Council resolutions on
    terrorism, its financing and proliferation financing, and maintains the
    Palestinian national designation list.
  url: https://sanction.pgp.ps/en/About
  country: ps
  official: true
data:
  url: https://sanction.pgp.ps/ar/SanctionFiles_arb
  format: XLS
  lang: ara
dates:
  formats: ["%Y/%m/%d"]
tags:
  - list.sanction
  - list.terror

assertions:
  min:
    schema_entities:
      Person: 35
      Organization: 12
    country_entities:
      il: 30
  max:
    schema_entities:
      Person: 90
      Organization: 30

names:
  schema_rules:
    # Notes in the Arabic part of a name, e.g. ملقب "كوكو" (nicknamed "Koko"),
    # اسم الشهرة (known as), اسم العائلة السابق (former surname), and curly
    # quotes around a nickname, e.g. הראל ליבי “קוקו”. " is not rejected, as
    # Hebrew uses it in abbreviations like בע"מ (Ltd).
    Person:
      reject_chars: "،“”"
      reject_strings: ["ملقب", "اسم الشهرة", "اسم العائلة السابق"]
    LegalEntity:
      # منظمة "…" الإسرائيلية - "the Israeli organisation …"
      reject_chars: "()،"
      reject_strings: ["منظمة"]

lookups:
  # parse_xls_sheet slugifies the Arabic headers; map them to English keys.
  columns:
    options:
      - match: alrqm # الرقم
        value: number
      - match: alasm # الإسم
        value: name
      - match: aljns # الجنس
        value: gender
      - match: asm_alwald # اسم الوالد
        value: father_name
      - match: alknyt # الكنية
        value: alias
      - match: alkyan_almrtbt # الكيان المرتبط
        value: affiliation
      - match: alnwan # العنوان
        value: address
      - match: tarykh_almylad # تاريخ الميلاد
        value: birth_date
      - match: alwthyqt_alshkhsyt # الوثيقة الشخصية
        value: doc_type
      - match: rqm_alwthyqt # رقم الوثيقة
        value: doc_number
      - match: asm_alam # اسم الأم
        value: mother_name
      - match: aljnsyt # الجنسية
        value: nationality
      - match: tarykh_aladraj # تاريخ الإدراج
        value: listing_date
      # مضمون آخر تعديل (individuals) / آخر تعديل (entities)
      - match: [mdmwn_akhr_tdyl, akhr_tdyl]
        value: amendment
      - match: tarykh_akhr_tdyl # تاريخ آخر تعديل
        value: amendment_date
      - match: alasm_alkyan # الإسم الكيان
        value: entity_name
      - match: alwsf # الوصف
        value: description
  type.gender:
    options:
      - match: ذكر
        value: male
      - match: انثى
        value: female
  type.country:
    normalize: true
    options:
      - match:
          - إسرائيلي
          - اسرائيلي
          - إسرائيلية
          - اسرائيلية
        value: il
      # "Israeli, possibly also holding US/French citizenship" - only the
      # Israeli nationality is asserted by the source.
      - match:
          - إسرائيلي، احتمال وجود جنسية أمريكية (جدته سوزانا كاتس أمريكية)
          - إسرائيلي، احتمالية وجود جنسية فرنسية (والده فرنسي)
          - إسرائيلي، احتمالية وجود جنسية أمريكية
        value: il
  type.date:
    options:
      - match: "-"
        value: null
      # "unconfirmed"
      - match: 2000/09/06- غير مؤكد
        value: "2000-09-06"
  type.string:
    options:
      - match: "-"
        value: null
      # "(according to the French nationality)", a note on one father's name
      - match: حسب الجنسية الفرنسية
        value: null
  type.text:
    options:
      - match: "-"
        value: null
  # Cells that name more than one place are split into one address per place:
  # "وفقا لبيانات اخرى: …" ("according to other data: …") gives an alternative
  # address, "يتواجد في" ("stays at"), "يقيم في" ("lives in") or "حالياً"
  # ("currently") a second place of residence next to the home settlement.
  # One cell also repeats the affiliated entity (الكيان المرتبط).
  address:
    normalize: true
    options:
      - match: "مستوطنة يتسهار (وفقا لبيانات اخرى: كفار سابا)"
        values:
          - مستوطنة يتسهار
          - كفار سابا
      - match: "بؤرة شومريه عهيمك الاستعمارية قرب مستعمرة شيلو المقامة على اراضي محافظة رام الله، (وفقاً لبيانات أخرى: في بؤرة حفات هارونيه)"
        values:
          - بؤرة شومريه عهيمك الاستعمارية قرب مستعمرة شيلو المقامة على اراضي محافظة رام الله
          - بؤرة حفات هارونيه
      - match: "مستعمرة كوخاف يعقوب مقامة على اراضي محافظة القدس، يقيم في بؤرة استعمارية -مزرعة وادي ترزة، تابعة لمستعمرة الحمرا في منطقة الاغوار (وفقاً لبيانات أخرى: مزرعة موشي)."
        values:
          - مستعمرة كوخاف يعقوب مقامة على اراضي محافظة القدس
          - بؤرة استعمارية -مزرعة وادي ترزة، تابعة لمستعمرة الحمرا في منطقة الاغوار
          - مزرعة موشي
      - match: 'البؤرة الاستيطانية "يشوف هداعت" (وفقا لبيانات اخرى : مستوطنة شيلو)'
        values:
          - البؤرة الاستيطانية "يشوف هداعت"
          - مستوطنة شيلو
      - match: 'البؤرة الاستيطانية "هافات هجلعاد" بالقرب من قرية فرعته بين محافظتي نابلس وقلقيلية (وفقا لبيانات اخرى: مستوطنة يتسهار)'
        values:
          - البؤرة الاستيطانية "هافات هجلعاد" بالقرب من قرية فرعته بين محافظتي نابلس وقلقيلية
          - مستوطنة يتسهار
      # Stray leading colon and unbalanced quote
      - match: ': مستعمرة ياكير- مقامة على اراضي سلفيت، يتواجد في بؤرة " شوفي آرتس الاستعمارية مقامة على أراضي سلفيت.'
        values:
          - مستعمرة ياكير- مقامة على اراضي سلفيت
          - بؤرة شوفي آرتس الاستعمارية مقامة على أراضي سلفيت
      - match: "بؤرة متزبي يئير الاستعمارية، قرب سوسيا – يطا، محافظة الخليل\n\u00ad\tالكيان المرتبط: شبيبة التلال/فتيان التلال، بالعبرية נוער הגבעות"
        value: بؤرة متزبي يئير الاستعمارية، قرب سوسيا – يطا، محافظة الخليل
      # "originally from Beit Ein in Gush Etzion, now lives in the Maoz Esther outpost"
      - match: الأصل من بيت عين في غوش عتصيون والآن يقيم في بؤرة معوز استير المقامة على أراضي محافظة القدس
        values:
          - بيت عين في غوش عتصيون
          - بؤرة معوز استير المقامة على أراضي محافظة القدس
      # "lives in the old city of Hebron, used to live in Kiryat Arba"
      - match: يسكن في البلدة القديمة في الخليل، وكان يسكن في مستوطنة كريات أربع.
        values:
          - البلدة القديمة في الخليل
          - مستوطنة كريات أربع
      # Talmon, with the Hebrew name in brackets
      - match: تيلمون (טלמון)
        value: تيلمون
      # "… stays at and carries out attacks on al-Mu'arrajat and Ein al-Auja"
      - match: بؤرة خابات ريمونيم الاستعمارية - مقامة على أراضي محافظة رام الله، يتواجد ويقوم بالاعتداءات على المعرجات وعين العوجا
        value: بؤرة خابات ريمونيم الاستعمارية - مقامة على أراضي محافظة رام الله
      - match: مستعمرة يتسهار المقامة على مجموعة بلدات في نابلس، يقيم حالياً بؤرة  رامات ماجرون الاستعمارية - مقامة على اراضي برقة
        values:
          - مستعمرة يتسهار المقامة على مجموعة بلدات في نابلس
          - بؤرة رامات ماجرون الاستعمارية - مقامة على اراضي برقة
      - match: شارع ابراهام افينو- مستعمرة كريات 4 المقامة على اراضي الخليل، يتواجد في بؤرة سديه أفرايم الاستعمارية – مقامة على أراضي كفر نعمة، راس كركر جبل الريسان.
        values:
          - شارع ابراهام افينو- مستعمرة كريات 4 المقامة على اراضي الخليل
          - بؤرة سديه أفرايم الاستعمارية – مقامة على أراضي كفر نعمة، راس كركر جبل الريسان
      - match: القدس، يتواجد في خابات مياتريم – بؤرة استعمارية مقامة على أراضي خربة زنوتا – الظاهرية جنوب الخليل
        values:
          - القدس
          - خابات مياتريم – بؤرة استعمارية مقامة على أراضي خربة زنوتا – الظاهرية جنوب الخليل
      - match: مستعمرة بيت ايل (ب) – المقامة على أراضي البيرة، يتواجد حالياً في بؤرة جفعات رونين الاستعمارية (مقامة على اراضي محافظة نابلس)
        values:
          - مستعمرة بيت ايل (ب) – المقامة على أراضي البيرة
          - بؤرة جفعات رونين الاستعمارية (مقامة على اراضي محافظة نابلس)
      - match: مستعمرة عتنئيل- مقامة على اراضي جنوب الخليل، يتواجد في مزرعة يهودا – بؤرة استعمارية مقامة على أراضي الظاهرية – جنوب الخليل
        values:
          - مستعمرة عتنئيل- مقامة على اراضي جنوب الخليل
          - مزرعة يهودا – بؤرة استعمارية مقامة على أراضي الظاهرية – جنوب الخليل
      - match: مستعمرة حلميش (نفيه تسوف) المقامة على اراضي من محافظة رام الله، يتواجد في مزرعة زافي، بؤرة استعمارية مقامة على أراضي قريبة جيبيا – رام الله.
        values:
          - مستعمرة حلميش (نفيه تسوف) المقامة على اراضي من محافظة رام الله
          - مزرعة زافي، بؤرة استعمارية مقامة على أراضي قريبة جيبيا – رام الله
      # "Elad, currently: Kiryat Ekron"
      - match: "مستعمرة العاد ، حالياً: كريات عكرون"
        values:
          - مستعمرة العاد
          - كريات عكرون
      # "lives in the Dorot farm (…)"
      - match: يقيم في مزرعة دوروت (بؤرة ظهر  صبح الاستيطانية) المقامة على سلسلة جبال خلة حسان بين محافظتي قلقيلية وسلفيت
        value: مزرعة دوروت (بؤرة ظهر صبح الاستيطانية) المقامة على سلسلة جبال خلة حسان بين محافظتي قلقيلية وسلفيت
  doc_type:
    normalize: true
    options:
      - match:
          - هوية إسرائيلية
          - هوية اسرائيلية
        doc_type: Israeli identity card
        country: il
  # Maps the affiliated-entity cell to the entity's name exactly as listed on
  # the entities sheet; null means no listed entity.
  affiliation:
    options:
      # Hilltop Youth, incl. the truncated "הגבעו" variant
      - match:
          - شبيبة التلال/فتيان التلال، بالعبرية נוער הגבעות
          - شبيبة التلال/فتيان التلال، بالعبرية נוער הגבעו
        value: شبيبة التلال / فتيان التلال ، بالعبرية נוער הגבעות
      # Price Tag
      - match:
          - تدفيع الثمن (تاغ ميخير)
          - من نشطاء منظمة تدفيع الثمن
          - جماعة تدفيع الثمن المتطرفة
        value: تدفيع الثمن (تاغ ميخير)
      # "the right-wing organisation Lahava" - Lehava, spelled differently
      - match: منظمة لاهافا اليمينية
        value: 'ليهافا، بالعبرية: להב"ה'
      - match:
          - "-"
          # "the far right" - not a listed entity
          - اليمين المتطرف
          # "unspecified (works as a guard of the Yitzhar settlement)"
          - غير محدد (يعمل حارس مستعمرة يتسهار)
          # "member of the extremist organisation Tsav 8": the list designates
          # Tzav 9, but the source does not say they are the same group.
          - عضوة في منظمة تساف8 المتطرفة
        value: null
