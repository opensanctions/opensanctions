# Alembic configuration for the developer workflow. The migration scripts
# live inside the ``zavod`` package (``zavod/migrations``) so they ship with
# installed distributions; this file only points the developer command at
# them. The database connection is supplied at runtime by
# ``zavod/migrations/env.py``, which reads ``ZAVOD_DATABASE_URI`` (falling
# back to ``OPENSANCTIONS_DATABASE_URI``), so there is no ``sqlalchemy.url``
# here.

[alembic]
# Path to migration scripts, relative to this file.
script_location = %(here)s/zavod/migrations

# Make the package importable so env.py can ``from zavod.db import ...``.
prepend_sys_path = %(here)s

path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
