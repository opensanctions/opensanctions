# Alembic configuration for the developer workflow. The migration scripts
# live inside the ``zavod`` package (``zavod/zavod/migrations``) so they
# ship with installed distributions; this file points the developer command
# at them through a named environment:
#
#   alembic -c alembic.ini -n zavod upgrade head
#
# The database connection comes from ``sqlalchemy.url`` if set here, else
# ``ZAVOD_DATABASE_URI`` (falling back to ``OPENSANCTIONS_DATABASE_URI``);
# see ``zavod/migrations/env.py``. This file sets no URL. A ``[pravda]``
# section joins once the pravda dependency does.

[DEFAULT]
# Make the project importable so env.py can ``from zavod.db import ...``.
prepend_sys_path = %(here)s

[zavod]
# Path to migration scripts, relative to this file.
script_location = %(here)s/zavod/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
