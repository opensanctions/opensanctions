# Greenland has its own country code, but its government is not national.
# This makes the level of Greenlandic bodies tricky.
- item:
    id: 1213114
    caption: Air Greenland A/S, Chief Commercial Officer
    countries:
      - gl
    subnational_areas: []
    dataset: dk_pep
  annotations:
    - level: gov.state
      roles:
        - gov.soe
      seniority: senior
      type: golden
      note: The Greenlandic Self-Government controls Air Greenland and sits below
        the Danish national government. A chief commercial officer is a senior executive
        with enterprise-wide responsibility.
