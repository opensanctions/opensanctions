          positions:
            - name: Alternate
              organization: Lakes Basin Commission Council
              jurisdiction: Bellanor, Ferndale, Harwick
              start_date: Mar, 2024
        - name: Dr. Marta Velling
          positions:
            - name: Delegate
              organization: Lakes Basin Commission Council
              jurisdiction: Caldera Isles, Pinehaven, Stonebrook
              start_date: Jun, 2025
        - name: Mrs. Rosa Delacampra
          positions:
            - name: Alternate
              organization: Lakes Basin Commission Council
              jurisdiction: Caldera Isles, Pinehaven, Stonebrook
              start_date: Jun, 2025
