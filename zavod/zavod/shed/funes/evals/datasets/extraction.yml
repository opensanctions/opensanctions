      - InspectionF1
  - name: wrong_subject_roster
    inputs:
      fixture: roster_table
      url: https://www.lbc.example.org/governance/delegates
      people_sought: Council delegates and alternates
      subject_label: Organization
      subject: Calder Sea Commission
    expected_output:
      kind: miss
      reason: The page lists delegates and alternates of the Lakes Basin Commission Council, not the Calder Sea Commission.
    evaluators:
      - IsInstance:
          type_name: Miss
          evaluation_name: miss_match
  - name: bot_challenge
    inputs:
      fixture: bot_challenge
      url: https://www.nw-tribunal.example.org/secretariat/council
