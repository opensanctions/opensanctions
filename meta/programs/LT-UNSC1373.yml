id: 328
title: Lithuania Counter-Terrorism (UNSCR 1373) Asset Freeze List
key: LT-UNSC1373
url: https://fntt.lrv.lt/lt/tarptautines-finansines-sankcijos/JT-STR-1373-sarasas/
summary: >
  Lithuania implements UN Security Council Resolution 1373 (2001) through a list,
  published by the Financial Crime Investigation Service (FNTT), of natural or legal
  persons, groups and entities associated with terrorist acts. The funds and other
  financial assets of listed parties must be frozen.
