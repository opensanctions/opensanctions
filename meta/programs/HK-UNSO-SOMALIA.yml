title: Hong Kong implementation of UN sanctions concerning Somalia
key: HK-UNSO-SOMALIA
url: https://www.cedb.gov.hk/en/policies/united-nations-security-council-sanctions.html
summary: >
  Hong Kong's implementation of the UN Security Council sanctions concerning
  Somalia under the United Nations Sanctions Ordinance. It targets individuals
  and entities associated with Al-Shabaab in Somalia, as designated by the
  Security Council committee established under resolution 2713. Designated
  persons and entities are subject to an asset freeze, and designated
  individuals are barred from entering or transiting Hong Kong. Supplying arms
  and related materiel to designated persons and entities is also prohibited.
issuer: hk_cedb
dataset: hk_cedb_sanctions
aliases:
  - United Nations Sanctions (Somalia) Regulation 2019 (Cap. 537CG)
  - Resolution 2713
target_territories:
  - so
measures:
  - Asset freeze
  - Travel ban
  - Arms restrictions
