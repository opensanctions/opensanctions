title: "Hong Kong implementation of UN sanctions concerning ISIL (Da'esh) and Al-Qaida"
key: HK-UNSO-ISIL
url: https://www.cedb.gov.hk/en/policies/united-nations-security-council-sanctions.html
summary: >
  Hong Kong's implementation of the UN Security Council sanctions concerning
  ISIL (Da'esh) and Al-Qaida under the United Nations Sanctions Ordinance. It
  targets individuals, groups, undertakings and entities associated with ISIL
  (Da'esh) and Al-Qaida, as designated by the Security Council committee
  established under resolutions 1267, 1989 and 2253. Designated persons and
  entities are subject to an asset freeze, and designated individuals are barred
  from entering or transiting Hong Kong. Supplying arms and related materiel to
  designated persons and entities is also prohibited.
issuer: hk_cedb
dataset: hk_cedb_sanctions
aliases:
  - United Nations Sanctions (ISIL and Al-Qaida) Regulation (Cap. 537CB)
  - Resolutions 1267, 1989, 2253
target_territories:
  - zz
measures:
  - Asset freeze
  - Travel ban
  - Arms restrictions
