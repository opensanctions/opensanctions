id: 14
title: Cyber-Related Sanctions
key: US-CYB
url: https://ofac.treasury.gov/sanctions-programs-and-country-information/sanctions-related-to-significant-malicious-cyber-enabled-activities
summary: |
  Targets persons responsible for or complicit in significant malicious
  cyber-enabled activities, such as attacks on critical infrastructure,
  ransomware operations, election interference, or misappropriation of funds,
  trade secrets, or personal data. Designated persons generally have their US
  assets frozen, and US persons are barred from transactions with them.

  The program also covers persons involved in significant theft of US trade
  secrets under the Protecting American Intellectual Property Act. Measures
  under the Act vary by designation: entities may also face limits on US
  loans, banking, foreign exchange, and investment, and individuals are barred
  from entry into the United States.
