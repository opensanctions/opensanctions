title: Hong Kong implementation of UN sanctions concerning Yemen
key: HK-UNSO-YEMEN
url: https://www.cedb.gov.hk/en/policies/united-nations-security-council-sanctions.html
summary: >
  Hong Kong's implementation of the UN Security Council sanctions concerning
  Yemen under the United Nations Sanctions Ordinance. It targets individuals and
  entities engaging in or supporting acts that threaten the peace, security or
  stability of Yemen, as designated by the Security Council committee
  established under resolution 2140. Designated persons and entities are subject
  to an asset freeze, and designated individuals are barred from entering or
  transiting Hong Kong. Supplying arms and related materiel to designated
  persons and entities is also prohibited.
issuer: hk_cedb
dataset: hk_cedb_sanctions
aliases:
  - United Nations Sanctions (Yemen) Regulation 2019 (Cap. 537CI)
  - Resolution 2140
target_territories:
  - ye
measures:
  - Asset freeze
  - Travel ban
  - Arms restrictions
