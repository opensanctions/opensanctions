title: Hong Kong implementation of UN sanctions concerning South Sudan
key: HK-UNSO-SSUDAN
url: https://www.cedb.gov.hk/en/policies/united-nations-security-council-sanctions.html
summary: >
  Hong Kong's implementation of the UN Security Council sanctions concerning
  South Sudan under the United Nations Sanctions Ordinance. It targets
  individuals and entities responsible for or complicit in actions that threaten
  the peace, security or stability of South Sudan, as designated by the Security
  Council committee established under resolution 2206. Designated persons and
  entities are subject to an asset freeze, and designated individuals are barred
  from entering or transiting Hong Kong.
issuer: hk_cedb
dataset: hk_cedb_sanctions
aliases:
  - United Nations Sanctions (South Sudan) Regulation 2019 (Cap. 537CK)
  - Resolution 2206
target_territories:
  - ss
measures:
  - Asset freeze
  - Travel ban
