name: docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y -qq libicu-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          # Keep source-built wheels (pyicu, plyvel) but drop prebuilt ones
          # before saving the cache, per uv's CI guidance.
          prune-cache: true
          # Only zavod/pyproject.toml feeds these installs; the default glob
          # also keys on unrelated contrib/ requirements and lock files.
          cache-dependency-glob: zavod/pyproject.toml
      - name: Install requirements
        working-directory: zavod
        env:
          # uv pip requires a virtual environment by default; install into
          # the setup-python environment instead, as pip did.
          UV_SYSTEM_PYTHON: 1
        run: |
          # pip would ignore the [tool.uv] overrides in pyproject.toml.
          uv pip install -q -e ".[dev,docs]"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with mkdocs
        working-directory: zavod
        run: mkdocs build -c -d site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./zavod/site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
