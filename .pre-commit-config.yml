repos:
  # prek's Rust built-ins: no hook repo to fetch and no Python env to build.
  # Dependabot skips this entry because it has no rev.
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
        exclude: '\.html?$'
      - id: check-merge-conflict
      - id: check-added-large-files
        # eu_journal_sanctions commits EUR-Lex consolidated texts as source
        # data, and these are often larger than the size limit.
        exclude: '^datasets/eu/journal_sanctions/data/'
  - repo: local
    hooks:
      - id: forbid-yaml-extension
        name: Forbid .yaml files (use .yml instead)
        entry: '.yaml files are not allowed. Please use .yml extension instead.'
        language: fail
        files: 'datasets/.*\.yaml$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Ruff finds no configuration for files outside zavod/, so without --config it
      # falls back to its built-in defaults.
      - id: ruff-check
        args: ['--fix', '--config', 'zavod/pyproject.toml']
      - id: ruff-format
        args: ['--config', 'zavod/pyproject.toml']
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        # octal integers are a pitfall to anyone not intimately familiar with YAML, so disallow them
        # To illustrate the problem: yaml.safe_load('value: 0555567') → {'value': 187255}
        args: ["-d", "{extends: default, rules: {octal-values: {forbid-implicit-octal: true, forbid-explicit-octal: true}, document-start: disable, line-length: disable}}"]

  # mypy imports zavod and the crawler dependencies, so it runs in the
  # activated venv instead of an isolated hook environment. This is not
  # perfect, but it avoids re-declaring every dependency here.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: |
          (?x)^(
          zavod/zavod/tests|
          contrib/|
          datasets/
          )
        args: ['--strict']
      - id: mypy-datasets
        name: mypy-datasets
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: "datasets/"
        args: ['--strict', '--explicit-package-bases']
  - repo: local
    hooks:
      - id: zavod-ui-lint
        name: ESLint
        entry: bash -c "cd ui && npx eslint --fix"
        language: system
        files: '^ui/'
        pass_filenames: false
